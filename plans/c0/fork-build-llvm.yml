name: build-cajeta-llvm
# Builds an LLVM+clang+lld toolchain matching cajeta's requirements and publishes
# it as a GitHub Release asset. This file belongs in the FORK
# (jklappenbach/cajeta-llvm — the renamed llvm-project fork), at
# .github/workflows/build-cajeta-llvm.yml, on the `cajeta-spirv` branch. cajeta CI
# then downloads the asset (see cajeta-ci-consume.yml).
#
# Build contract mirrors cajeta's live config (cpp/llvm-project/build/CMakeCache.txt):
#   Release · RTTI=ON · assertions=OFF · static libs · targets X86;NVPTX;AMDGPU;SPIRV
#   + projects clang;lld so the artifact bundles a version-matched clang-23 (cajeta
#     compiles its runtime to bitcode via find_program(clang-${LLVM_VERSION_MAJOR})).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. cajeta-llvm-23-r1"
        required: true
  push:
    tags: ["cajeta-llvm-*"]

permissions:
  contents: write          # needed to create the Release

jobs:
  build:
    # Host-artifact matrix mirrors cajeta release.yml. One toolchain per HOST; the
    # X86;NVPTX;AMDGPU;SPIRV targets are all in each. Build linux-x64 FIRST — it
    # unblocks all Part C dev + AMD (Strix Halo) AND NVIDIA (Windows box via WSL2,
    # reusing this same linux-x64 artifact — see plans/c0 / gpu-plan B5).
    strategy:
      fail-fast: false
      matrix:
        include:
          # ACTIVE — the only leg needed to unblock development + on-device testing.
          - host: linux-x64
            runs-on: [self-hosted, linux, x64]   # Strix Halo. No self-hosted box?
            #          ^ swap for: ubuntu-22.04   # (slow; keep LLVM_PARALLEL_LINK_JOBS=1 to avoid link OOM)
            asset_os: linux-x64
          # ---- Remaining legs mirror release.yml — uncomment per host when needed. ----
          # NOTE: the apt-based dep-install + tar steps below are Linux-only; the mac
          # (brew) and Windows (MSYS2, .zip, mingw-w64) legs need their own
          # dep-install/package steps mirroring release.yml before enabling.
          # - host: linux-arm64                  # also serves Jetson Orin / cradle (arm64)
          #   runs-on: ubuntu-24.04-arm
          #   asset_os: linux-arm64
          # - host: macos-arm64
          #   runs-on: macos-14
          #   asset_os: macos-arm64
          # windows-x64 is NOT in this matrix — it can't share the apt/bash steps
          # below (different shell, package manager, ccache path, tar host). It is a
          # dedicated job (`build-windows`) at the end of this file instead.
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Install build deps
        # Self-hosted runners (e.g. the Strix Halo) pre-provision these and often
        # lack passwordless sudo — skip apt there; only GitHub-hosted runners need it.
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache clang lld zstd python3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-llvm-${{ github.sha }}
          restore-keys: ccache-llvm-

      - name: Configure
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_TARGETS_TO_BUILD="X86;NVPTX;AMDGPU;SPIRV" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_BUILD_LLVM_DYLIB=OFF -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install"

      - name: Build + install
        run: ninja -C build install

      - name: Package
        id: pack
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # TAG already begins with "cajeta-llvm-"; don't re-prepend it.
          NAME="${TAG}-${{ matrix.asset_os }}.tar.zst"
          tar --zstd -cf "$NAME" -C "$PWD" llvm-install
          sha256sum "$NAME" > "$NAME.sha256"
          echo "asset=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          files: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.asset }}.sha256

  # ===========================================================================
  # build-windows — the x86_64-w64-mingw32 host leg (the C0 runbook's "fiddliest,
  # release-only" leg, now active because cajeta's Tier-1 SPIR-V codegen references
  # fork-only intrinsic enums that stock MSYS2 LLVM 22 lacks — so the Windows
  # release can no longer fall back to distro LLVM and MUST link the fork).
  #
  # Built NATIVELY under MSYS2 / MinGW-w64 — the SAME environment cajeta is built
  # in on Windows (cajeta release.yml uses msys2/setup-msys2 MINGW64). That parity
  # is the whole point: cajeta's C++ is compiled by mingw `c++` (g++) and links the
  # fork's STATIC LLVM archives, so those archives must be produced by the matching
  # mingw toolchain + the shared GCC libstdc++ ABI. clang+lld are bundled per the
  # build contract — and lld in particular MUST come from the fork (cajeta links
  # lldELF/lldCommon in-process for --emit=exe; mingw's lld-22 cannot link against
  # fork LLVM-23 libs without a symbol/ABI mismatch).
  #
  # COST WARNING: a full clang+lld+llvm build on a 2-core GH-hosted windows-latest
  # runner is slow and can hit the 6 h job cap or OOM at link. Prefer a SELF-HOSTED
  # Windows runner (swap `runs-on`). ccache + LLVM_PARALLEL_LINK_JOBS=1 mitigate but
  # don't eliminate the risk. The C0 runbook flagged this leg as the hard one.
  # ===========================================================================
  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/cajeta-llvm-') }}
    runs-on: windows-latest            # swap for [self-hosted, windows, x64] if available
    defaults:
      run:
        shell: 'msys2 {0}'
    env:
      # Keep ccache inside the workspace so both MSYS2 (bash) and actions/cache
      # (node, Windows paths) address the same dir. ccache.exe accepts this path.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      # MINGW64 to match cajeta's own Windows build env (native PE, libstdc++).
      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-python
            tar

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-llvm-windows-${{ github.sha }}
          restore-keys: ccache-llvm-windows-

      # Native mingw build. Bootstrap with mingw clang/clang++ (its libstdc++ is the
      # same GCC libstdc++ cajeta's g++ links, so the produced archives are ABI-
      # compatible). If a libstdc++ ABI mismatch ever shows up at cajeta link time,
      # the fallback is to build the fork with gcc/g++ here instead (-DCMAKE_*
      # _COMPILER=gcc/g++) to byte-match cajeta's c++.exe; clang is the contract default.
      - name: Configure
        run: |
          set -euo pipefail
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_TARGETS_TO_BUILD="X86;NVPTX;AMDGPU;SPIRV" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_BUILD_LLVM_DYLIB=OFF -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install"

      - name: Build + install
        run: ninja -C build install

      - name: Package
        id: pack
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="${TAG}-windows-x64.tar.zst"
          tar --zstd -cf "$NAME" -C "$PWD" llvm-install
          sha256sum "$NAME" > "$NAME.sha256"
          echo "asset=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          files: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.asset }}.sha256
