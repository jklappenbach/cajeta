[package]
name = "profile-concurrent"
version = "0.1.0"
edition = "2021"

# std atomics, Mutex, RwLock, thread_local!, std::sync::mpsc; tokio for the
# Semaphore, sleep and spawn rows; crossbeam-channel for the channel rows
# (Channel.md: the crossbeam harness shapes). Versions are the Cargo.lock pins.

[dependencies]
tokio = { version = "=1.53.1", features = ["rt", "rt-multi-thread", "time", "sync"] }
crossbeam-channel = "=0.5.16"

[[bin]]
name = "profile-concurrent"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
