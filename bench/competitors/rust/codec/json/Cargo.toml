[package]
name = "codec-json"
version = "0.1.0"
edition = "2021"

# codec/json-* competitor (bench/codec/json/Json.md): serde_json, the de-facto
# Rust JSON library, on the nativejson corpus and the JSON_checker set.
[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly rounded float parsing, so parse -> serialize -> parse
# is the identity on canada (the default fast path is off by an ulp on some).
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "codec-json"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
