[package]
name = "profile-codec"
version = "0.1.0"
edition = "2021"

# JSON parse-to-DOM competitors for the codec area. serde_json is the de-facto
# standard; simd-json is the SIMD-accelerated SOTA (port of simdjson).
[dependencies]
serde_json = "1"
simd-json = "0.13"

[[bin]]
name = "profile-codec"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
