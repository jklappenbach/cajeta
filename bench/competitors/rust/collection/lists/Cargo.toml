[package]
name = "collection-lists"
version = "0.1.0"
edition = "2021"

# collection/ sequence ids: ArrayList, LinkedList, Heap, ImmutableList,
# Collectors, binary-search. std only (Vec, LinkedList, BinaryHeap, Arc<[T]>).
[dependencies]

