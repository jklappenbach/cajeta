[package]
name = "profile-hash"
version = "0.1.0"
edition = "2021"

# hash/ competitors for bench/hash/{XXHash3,SipHash}.md (benchmark-reference
# unit 8): xxhash-rust, the canonical XXH3 port, and siphasher's SipHash-2-4.
# (The sha2 / md-5 / blake3 rows this program used to print have no catalog
# page; they belong to a later crypto/ page for dev.cajeta.crypto.)
[dependencies]
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
siphasher = "=1.0.4"

[[bin]]
name = "profile-hash"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
