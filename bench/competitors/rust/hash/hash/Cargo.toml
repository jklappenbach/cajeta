[package]
name = "profile-hash"
version = "0.1.0"
edition = "2021"

# Bulk hash-throughput competitors (SMHasher's bulk metric). xxhash-rust is the
# canonical XXH3 port; sha2 / md-5 are the RustCrypto reference implementations.
[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
md-5 = "0.10"
blake3 = "1"

[[bin]]
name = "profile-hash"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
