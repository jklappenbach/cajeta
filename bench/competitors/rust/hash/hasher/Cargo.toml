[package]
name = "bench-hasher"
version = "0.1.0"
edition = "2021"

# hash/ competitors for bench/hash/{DefaultHasher,Hash}.md (benchmark-reference
# unit 8): std's DefaultHasher (SipHash-1-3, what HashMap's RandomState builds
# per key) and #[derive(Hash)]. No dependencies.
[dependencies]

[[bin]]
name = "bench-hasher"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
