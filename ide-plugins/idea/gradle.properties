pluginGroup = dev.cajeta.idea
pluginName = Cajeta
pluginRepositoryUrl = https://github.com/cajeta/cajeta
pluginVersion = 0.1.0

# 242 = IntelliJ IDEA 2024.2, 261 = 2026.1, 262 = 2026.2
pluginSinceBuild = 242
pluginUntilBuild = 262.*

platformType = IC
platformVersion = 2025.2.6.2

javaVersion = 21

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Configuration cache disabled while the ANTLR codegen task is wired in.
# Re-enable once we confirm the antlr plugin is configuration-cache safe.
org.gradle.configuration-cache = false
org.gradle.caching = true
