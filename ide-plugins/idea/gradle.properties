pluginGroup = dev.cajeta.idea
pluginName = Cajeta
pluginRepositoryUrl = https://github.com/cajeta/cajeta
pluginVersion = 0.1.0

# 242 = IntelliJ IDEA 2024.2, 261 = 2026.1, 262 = 2026.2.
# Open-ended upper bound (299.*) so routine IDE updates don't auto-disable the
# locally-installed dev plugin — the recurring "incompatible with 26x.*" trap.
# A marketplace release would pin a real tested ceiling instead.
pluginSinceBuild = 242
pluginUntilBuild = 299.*

platformType = IC
platformVersion = 2025.2.6.2

javaVersion = 21

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Configuration cache disabled while the ANTLR codegen task is wired in.
# Re-enable once we confirm the antlr plugin is configuration-cache safe.
org.gradle.configuration-cache = false
org.gradle.caching = true

# Heap for the Gradle and Kotlin daemons.
#
# Without these the plugin only compiles from cache. A full recompile
# (`--rerun-tasks`, or any cold cache — CI on a fresh runner, a new clone) dies
# with `java.lang.OutOfMemoryError` reported as a Kotlin "Backend Internal
# error: Exception during IR lowering". The file named in that message VARIES
# between runs, because it is whichever file happened to be in flight when the
# heap ran out — which is what makes it read as a compiler bug in unrelated
# code rather than as a memory setting.
#
# The Kotlin daemon is a separate JVM from Gradle's and does not inherit
# org.gradle.jvmargs, so both are set. 4g holds this source set with room to
# spare; the default is a fraction of that.
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs = -Xmx4g
