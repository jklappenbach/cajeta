[package]
name = "profile-stream"
version = "0.1.0"
edition = "2021"

# Iterator chains are stdlib; rayon is the de-facto data-parallel library, the
# competitor to Cajeta's .parallel() fork/join reduce.
[dependencies]
rayon = "1"

[[bin]]
name = "profile-stream"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
