# GPU probe captures for cajeta-xgboost, on PHOENIX (the self-hosted
# Windows/NVIDIA runner registered to THIS repo — personal-account runners
# are per-repo, which is why the workflow lives here while the probe source
# lives in cajeta-xgboost/tools/gpuprobe).
#
# Probes (select with the `probe` input):
#
# device-grads (gpu-numeric-fidelity 1.1.2): the xgboost fixtures' grad.npy
# rounds >= 1 are a numpy reconstruction, not a device dump.
# probe_device_grads.cu runs the verbatim 3.1.2 objective kernels over the
# committed fixture margins on the real GPU (expf = the SFU libdevice
# sequence) and this uploads the resulting device_grad/device_hess npys —
# the ground truth the multi-round parity tests were missing. Authorized by
# Julian 2026-07-29.
#
# evaluate-gain (gpu-numeric-fidelity 2.2.1): replay ONE node's split
# evaluation with a verbatim transcription of the evaluate agent
# (probe_evaluate_gain.cu) over a committed TreeBuilder dump
# (tools/gpuprobe/<dump>/), dumping every boundary's gain bits. Decides
# whether tiny_reg_mcw10 node 14's feature-4 pick is device arithmetic or
# something upstream of the evaluate kernel.
#
# Later rounds on the same harness: the Unit 3 scan probe.

name: gpu-probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Which probe to run'
        required: true
        type: choice
        options: [device-grads, evaluate-gain, train-repro, instrumented-eval]
        default: device-grads
      xgboost-ref:
        description: 'cajeta-xgboost ref to check out'
        required: true
        default: 'main'
      fixtures:
        description: 'device-grads only: comma-separated fixture dirs under tools/fixtures (names containing "multi" run the softmax kernel)'
        required: false
        default: 'tiny_binary,tiny_multi'
      dump:
        description: 'evaluate-gain only: dump dir under tools/gpuprobe'
        required: false
        default: 'node14'

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, gpu]
    timeout-minutes: ${{ inputs.probe == 'instrumented-eval' && 150 || 30 }}
    steps:
      - name: Checkout cajeta-xgboost
        uses: actions/checkout@v4
        with:
          repository: jklappenbach/cajeta-xgboost
          ref: ${{ inputs.xgboost-ref }}

      # instrumented-eval: build xgboost v3.1.2 from source with printf
      # instrumentation in the evaluate agent (tools/gpuprobe/
      # instrument_eval_3.1.2.patch), swap the built xgboost.dll into the
      # 3.1.2 wheel, and rerun the fixture. The prints show every tile winner
      # reaching Update (accept/reject) and each post-reduce node winner —
      # the ground truth for the node-14 selection question.
      - name: Checkout xgboost v3.1.2 source
        if: ${{ inputs.probe == 'instrumented-eval' }}
        uses: actions/checkout@v4
        with:
          repository: dmlc/xgboost
          ref: v3.1.2
          path: xgboost-src
          submodules: recursive

      - name: Build instrumented xgboost + rerun the fixture
        if: ${{ inputs.probe == 'instrumented-eval' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Git for Windows materializes CRLF by default; the patch is LF.
          git -C xgboost-src config core.autocrlf false
          git -C xgboost-src rm -q -rf --cached .
          git -C xgboost-src reset --hard HEAD
          git -C xgboost-src apply ..\tools\gpuprobe\instrument_eval_3.1.2.patch
          # cmake ships inside VS; the service PATH has no cmake.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vspath = & $vswhere -latest -property installationPath
          $cmake = Join-Path $vspath 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          & $cmake -S xgboost-src -B xgboost-src/build -A x64 `
            -DUSE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89 -DBUILD_DEPRECATED_CLI=OFF
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          & $cmake --build xgboost-src/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $dll = Get-ChildItem xgboost-src -Recurse -Filter xgboost.dll | Select-Object -First 1
          Write-Host ">> built: $($dll.FullName)"

          Invoke-WebRequest -Uri 'https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip' -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvbin -Force
          $env:UV_PYTHON_INSTALL_DIR = "$PWD\uv-pythons"
          $env:UV_CACHE_DIR = "$PWD\uv-cache"
          & uvbin\uv.exe python install 3.12
          & uvbin\uv.exe venv xgbenv --python 3.12
          & uvbin\uv.exe pip install --python xgbenv\Scripts\python.exe --quiet 'xgboost==3.1.2' numpy
          $wheeldll = Get-ChildItem xgbenv -Recurse -Filter xgboost.dll | Select-Object -First 1
          Write-Host ">> replacing wheel dll: $($wheeldll.FullName)"
          Copy-Item $dll.FullName $wheeldll.FullName -Force
          New-Item -ItemType Directory -Force -Path captures | Out-Null
          & xgbenv\Scripts\python.exe tools/gpuprobe/train_repro.py tools/fixtures/tiny_reg_mcw10 `
            2>&1 | Tee-Object -FilePath captures/instrumented-eval.txt
          if ($LASTEXITCODE -ne 0) { throw 'instrumented run failed' }

      - name: GPU + toolchain sanity
        shell: powershell
        run: |
          nvidia-smi -L
          nvcc --version

      # train-repro needs no nvcc: it retrains the fixture with the real pip
      # wheel on the real GPU, once per version, and reports the picked splits
      # (gpu-numeric-fidelity 2.2.1 — node 14 selection investigation).
      # PHOENIX has no `py` launcher and setup-python has no self-hosted tools
      # cache, so discover a locally installed python.
      - name: Retrain with the real wheels
        if: ${{ inputs.probe == 'train-repro' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The runner service (NetworkService) sees no python install, so
          # bootstrap uv INTO THE WORKSPACE — nothing lands outside $PWD.
          Invoke-WebRequest -Uri 'https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip' -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvbin -Force
          $env:UV_PYTHON_INSTALL_DIR = "$PWD\uv-pythons"
          $env:UV_CACHE_DIR = "$PWD\uv-cache"
          & uvbin\uv.exe python install 3.12
          New-Item -ItemType Directory -Force -Path captures | Out-Null
          foreach ($v in '3.1.2', '3.3.0') {
            Write-Host ">> xgboost $v"
            & uvbin\uv.exe venv "xgbenv-$v" --python 3.12
            & uvbin\uv.exe pip install --python "xgbenv-$v\Scripts\python.exe" --quiet "xgboost==$v" numpy
            & "xgbenv-$v\Scripts\python.exe" tools/gpuprobe/train_repro.py tools/fixtures/tiny_reg_mcw10 `
              2>&1 | Tee-Object -FilePath "captures/train-repro-$v.txt"
            if ($LASTEXITCODE -ne 0) { throw "train-repro failed for $v" }
          }

      # nvcc on Windows needs cl.exe; source the VS build env via vswhere.
      - name: Compile the probe (MSVC host env)
        if: ${{ inputs.probe == 'device-grads' || inputs.probe == 'evaluate-gain' }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          if "${{ inputs.probe }}"=="evaluate-gain" (
            nvcc -arch=native -O2 tools\gpuprobe\probe_evaluate_gain.cu -o probe_evaluate_gain.exe
          ) else (
            nvcc -arch=native -O2 tools\gpuprobe\probe_device_grads.cu -o probe_device_grads.exe
          )
          if errorlevel 1 exit /b 1

      - name: Run device-grads over the requested fixtures
        if: ${{ inputs.probe == 'device-grads' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in "${{ inputs.fixtures }}".Split(',')) {
            $f = $f.Trim()
            $mode = if ($f -like '*multi*') { 'multi' } else { 'binary' }
            $out = "captures/$f"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Write-Host ">> $f ($mode)"
            ./probe_device_grads.exe "tools/fixtures/$f" $mode $out
            if ($LASTEXITCODE -ne 0) { throw "probe failed for $f" }
          }

      - name: Run evaluate-gain over the dump
        if: ${{ inputs.probe == 'evaluate-gain' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "captures/${{ inputs.dump }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          ./probe_evaluate_gain.exe "tools/gpuprobe/${{ inputs.dump }}" $out
          if ($LASTEXITCODE -ne 0) { throw "evaluate-gain probe failed" }

      - name: Upload captures
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.probe }}-captures
          path: captures/
          if-no-files-found: error
