# Deploys cajeta.dev from main's site/ tree, the same steps release.yml runs
# after publishing: on every docs, bench-page or site change pushed to main,
# and by hand for when a release shipped but its deploy step did not run.
name: site-deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'bench/**/*.md'
      - 'site/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for the site build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Deploy the site to cajeta.dev
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repo."
            exit 1
          fi
          echo "deploying site data for $(jq -r '.tag // .version // "unknown"' site/src/data/latest-release.json)"
          cd site
          npm ci --no-audit --no-fund
          npm run manifest
          npx astro build
          npx wrangler deploy
          echo "::notice::cajeta.dev deployed from ${GITHUB_SHA::8}"
