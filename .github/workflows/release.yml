# Release workflow. Triggered when a tag matching v* lands on origin.
# Cross-builds the cajeta compiler for every supported target, then
# attaches the artifacts to the matching GitHub Release. The full flow
# and supported targets are documented in RELEASING.md.
#
# Non-trivial parts called out in inline comments:
#   - macOS jobs install LLVM via Homebrew and pass LLVM_DIR explicitly
#     to CMake (brew doesn't put LLVM on the default search path).
#   - Windows uses Chocolatey for LLVM 22 + vcpkg for ANTLR4 runtime
#     (apt-style "everything in one place" isn't available there).
#   - The build matrix is `fail-fast: false` so a flaky transient on
#     one target doesn't take down the whole release.
#   - RISC-V is not yet wired — cross-compilation needs a riscv64
#     sysroot with LLVM + ANTLR4 + zstd already provisioned. Tracked
#     in RELEASING.md as best-effort / future.

name: release

# Three ways to trigger:
#
#   1. Push a `v*` tag — full production release. Primary path.
#      `git tag v0.1.1 && git push origin v0.1.1`
#      Pre-releases use semver tags: `v0.2.0-rc1`, `v0.2.0-beta1` etc.
#      land as GitHub pre-releases automatically (recognized by the
#      `-` suffix per semver).
#
#   2. Actions UI → "release" → "Run workflow", mode = dry-run.
#      Builds + tests every target, skips the Release publish step
#      entirely. Use to verify the matrix works without touching
#      the public surface or creating any git tag. Default mode
#      when triggered manually.
#
#   3. Actions UI → "release" → "Run workflow", mode = production.
#      Equivalent to a `v*` tag push but triggered from the UI —
#      reads VERSION at run time, creates the tag, publishes as
#      latest. For when you don't want to do the local tag dance
#      (e.g. cutting a release from the GitHub mobile app).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'dry-run'
        options:
          - dry-run
          - production
      targets:
        description: 'Targets to build (comma-separated triples, or "all"). Dry-run only — production always builds every target.'
        required: false
        type: string
        default: 'all'
      tests:
        description: 'Targeted test run (dry-run only): space-separated gtest suite/test patterns run via cajeta_tests.sh INSTEAD of the release subset. Empty = full release subset. For iterating on a platform-specific failure without re-running everything.'
        required: false
        type: string
        default: ''
      test_env:
        description: 'Targeted test run only: space-separated KEY=VALUE pairs exported before the run (e.g. debug dump knobs like CAJETA_XPU_DEBUG_WAVE=1).'
        required: false
        type: string
        default: ''

permissions:
  contents: write   # needed for softprops/action-gh-release to create / update the Release

# The research/ PDFs live in Git LFS, but no build/test/release job needs
# them. Skip the LFS smudge filter on checkout so the ~900 MB of PDFs are
# never downloaded here — the pointers stay as small text files and don't
# count against the repo's LFS bandwidth on every CI run.
env:
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  # Resolve the build matrix. The canonical full target list lives here as
  # JSON; on a tag push or a production dispatch it is used whole, so a real
  # release always builds every target. On a DRY-RUN dispatch the `targets`
  # input filters it (comma-separated triples, or "all") so platform-specific
  # debugging triggers only the legs it needs — e.g. targets=aarch64-apple-darwin
  # builds just the macOS leg, no wasted compute on the other three. This
  # replaces the old "comment out matrix entries" hack (error-prone + had to be
  # reverted before release). Each entry carries its own `shell` (consumed by
  # defaults.run.shell below).
  setup:
    name: resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.f.outputs.matrix }}
    steps:
      - name: Filter targets
        id: f
        run: |
          set -euo pipefail
          FULL='[
            {"os":"ubuntu-latest","target":"x86_64-linux-gnu","archive_ext":"tar.gz","shell":"bash"},
            {"os":"ubuntu-24.04-arm","target":"aarch64-linux-gnu","archive_ext":"tar.gz","shell":"bash"},
            {"os":"macos-14","target":"aarch64-apple-darwin","archive_ext":"tar.gz","shell":"bash"},
            {"os":["self-hosted","Windows","X64","gpu"],"target":"x86_64-w64-mingw32","archive_ext":"zip","shell":"msys2 {0}"}
          ]'
          MODE='${{ github.event.inputs.mode }}'
          SEL='${{ github.event.inputs.targets }}'
          # Full matrix unless this is a dry-run dispatch with an explicit,
          # non-"all" target list. (Production / tag push always builds all.)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             || [ "$MODE" = "production" ] || [ -z "$SEL" ] || [ "$SEL" = "all" ]; then
            M=$(echo "$FULL" | jq -c '{include:.}')
          else
            M=$(echo "$FULL" | jq -c --arg sel "$SEL" \
                '($sel|split(",")|map(gsub("^ +| +$";""))) as $t | {include:[ .[] | select(.target as $x | $t|index($x)) ]}')
            if [ "$(echo "$M" | jq '.include|length')" -eq 0 ]; then
              echo "::error::targets='$SEL' matched no known target triples"; exit 1
            fi
          fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "::notice::building targets = $(echo "$M" | jq -c '[.include[].target]')"

  # Build the IntelliJ IDEA plugin once (plan §7). Its distribution zip is
  # downloaded by every compiler build job and embedded into the binary
  # (xxd -i in src/CMakeLists.txt) so `cajeta ide install` works from any
  # distribution form. Built before the matrix via `needs: plugin`.
  plugin:
    name: build IDE plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync plugin version to VERSION (D9)
        run: |
          set -euo pipefail
          V=$(cat VERSION | tr -d '[:space:]')
          echo "PLUGIN_VERSION=$V" >> "$GITHUB_ENV"
          echo "::notice::IDE plugin version = $V"

      - name: Build plugin
        working-directory: ide-plugins/idea
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon -PpluginVersion="${PLUGIN_VERSION}" buildPlugin

      # NOTE: `verifyPlugin` was removed from the release path. The JetBrains
      # plugin verifier spins up a full headless IDEA and downloads multiple
      # IDE distributions; in CI it hung/exhausted the runner, and a lost
      # runner fails the job even with continue-on-error — which then skips the
      # whole compiler matrix (needs: plugin) and reds the release. It's a
      # non-gating compatibility check with no release-blocking value, so it
      # belongs in a dedicated PR/CI workflow, not here. (Installer plan §7:
      # "tighten into a hard gate once proven stable" — it proved unstable.)

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-plugin
          path: ide-plugins/idea/build/distributions/*.zip
          if-no-files-found: warn

      # Sign + publish to the JetBrains Marketplace (plan §8 / D10). Production
      # only — never on dry-run — and pre-release tags (v*-rc1, v*-beta1) are
      # skipped so they don't land on the stable channel. No-op (warning, not
      # failure) until the signing cert / PUBLISH_TOKEN secrets are configured
      # AND the one-time manual first upload has been done on the Marketplace.
      - name: Publish plugin to JetBrains Marketplace
        if: github.event_name == 'push' || inputs.mode == 'production'
        working-directory: ide-plugins/idea
        continue-on-error: true
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          # Skip pre-release tags (don't ship rc/beta to the stable channel).
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${GITHUB_REF_NAME}" in
              *-*) echo "::notice::pre-release tag ${GITHUB_REF_NAME}; skipping Marketplace publish"; exit 0 ;;
            esac
          fi
          if [ -z "${PUBLISH_TOKEN:-}" ] || [ -z "${CERTIFICATE_CHAIN:-}" ]; then
            echo "::warning::Marketplace secrets (PUBLISH_TOKEN / signing cert) not set; skipping signPlugin + publishPlugin"
            exit 0
          fi
          # publishPlugin depends on signPlugin; run both explicitly for clarity.
          ./gradlew --no-daemon -PpluginVersion="${PLUGIN_VERSION}" signPlugin publishPlugin

  build:
    name: build (${{ matrix.target }})
    needs: [setup, plugin]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Matrix resolved by the `setup` job. Full 4-target list on a release
      # (tag push / production dispatch); filtered by the `targets` dispatch
      # input on a dry-run. Target notes:
      #   - x86_64-apple-darwin is intentionally absent (Intel Mac runners are
      #     scarce/slow + being wound down; Intel users build from source, see
      #     RELEASING.md).
      #   - windows uses MSYS2/MinGW-w64 (its entry's shell is 'msys2 {0}'),
      #     not MSVC — pacman ships prebuilt mingw-w64 LLVM/antlr4, the
      #     POSIX-ish surface keeps cajeta_runtime.c's conditionals minimal,
      #     and the result is a native PE (no cygwin1.dll dependency).
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    # ONE switch for the Windows static link, read by both the glog step and
    # Configure. They have to agree: glog is the only dep MSYS2 ships
    # shared-only, so the static build needs a from-source glog on glog_ROOT —
    # but pointing a SHARED build at that same static glog reintroduces the
    # exact conflict the shared link exists to avoid (libglog.a's std::regex
    # instantiations vs the clang-built fork's, 8x multiple definition,
    # measured in run 34416584191). Currently OFF: see the blocked-on-one-C++-
    # toolchain note on CAJETA_STATIC_WINDOWS in src/CMakeLists.txt.
    env:
      CAJETA_STATIC_WINDOWS: 'ON'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Fetch the full history so CMake's git rev-parse can stamp the
          # short hash into the binary. Shallow clones produce a "unknown"
          # hash, which is allowed but defeats the point.
          fetch-depth: 0

      - name: Read VERSION + derive release mode/tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -f VERSION ]; then
            V=$(cat VERSION | tr -d '[:space:]')
          else
            V="0.0.0-untagged"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

          # MODE: production on tag push, otherwise the workflow_dispatch
          # input (dry-run or production). Pre-releases are handled via
          # semver tags (`v0.2.0-rc1`) — softprops/action-gh-release auto-
          # detects the `-` suffix and marks them prerelease.
          MODE="${{ github.event_name == 'push' && 'production' || inputs.mode }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "production" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              # Tag push — ref version is authoritative.
              REF_TAG="${GITHUB_REF_NAME#v}"
              TAG="${GITHUB_REF_NAME}"
            else
              # Manual production trigger — derive from VERSION.
              REF_TAG="$V"
              TAG="v$V"
            fi
            REL_NAME="cajeta $TAG"
          else
            # Dry-run: still compute an artifact name so the upload step
            # works, but the release-publish job will short-circuit.
            REF_TAG="$V-dryrun-${{ github.run_number }}"
            TAG=""
            REL_NAME=""
          fi

          echo "ref_version=$REF_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$REL_NAME" >> "$GITHUB_OUTPUT"

          echo "::notice::release mode = $MODE; tag = ${TAG:-<none>}"

      # ---- Linux dependency install (apt) -------------------------------
      # Non-LLVM deps — always installed on every Linux leg.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # Mirror setup.sh's install_linux_apt list, MINUS LLVM — every leg
          # fetches the cajeta-llvm fork toolchain below (no distro LLVM).
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            libantlr4-runtime-dev \
            openjdk-21-jre \
            libgtest-dev \
            libgoogle-glog-dev \
            libzstd-dev \
            libzmq3-dev \
            libvulkan-dev \
            vim-common \
            libxxhash-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            rpm \
            file

      # ---- Windows: MSYS2 / MinGW-w64 (set up BEFORE the fetch) ----------
      #
      # MSYS2's mingw-w64 environment provides a near-POSIX surface on
      # Windows (winpthreads, libucontext, etc.) so the Unix-style cajeta
      # runtime compiles with minimal conditionals. Produces a native PE
      # binary (no cygwin1.dll dependency); the toolchain triple is
      # x86_64-w64-mingw32.
      #
      # This leg's default shell is `msys2 {0}` (defaults.run.shell ->
      # matrix.shell), so MSYS2 MUST be installed before any `run:` step that
      # uses it — including the toolchain fetch below, which needs curl/zstd/
      # tar from the MSYS2 environment. (On Linux/macOS these setup steps are
      # skipped and the fetch runs in plain bash.)
      #
      # Java is installed via actions/setup-java rather than pacman — MSYS2's
      # Java packaging is inconsistent (mingw-w64-x86_64-jre / -jdk-openjdk
      # don't exist). setup-java works across all platforms and adds java to
      # PATH so MSYS2's bash inherits it.
      - name: Setup Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # update: true to MATCH the cajeta-llvm fork build (build-cajeta-llvm.yml
          # also uses update: true). The fork's clang.exe/lld are mingw DYNAMIC
          # exes linked against the mingw runtime DLLs (libstdc++, libzstd, …); a
          # base-image (update: false) MSYS2 ships older DLLs missing exports they
          # need, so clang.exe fails to load with 0xC0000139 (ENTRYPOINT_NOT_FOUND)
          # at the runtime-bitcode compile. Matching update keeps the DLLs in sync.
          update: true
          path-type: inherit  # inherit Windows PATH so `java` from setup-java is visible
          # NO mingw llvm/lld/clang here: this leg links the cajeta-llvm FORK
          # (fetched below), and a second stock LLVM 22 on PATH/in the lib search
          # dirs would mis-resolve at link (the runbook's "two LLVMs" trap — cajeta
          # links lldELF/lldCommon + libLLVM*, which must ALL be the fork's v23).
          # cajeta's C++ is compiled by mingw `c++` (g++), so install gcc explicitly
          # (previously pulled transitively by the clang package). The runtime-bitcode
          # `clang` and in-process `lld` both come from the fork tree on PATH.
          # vulkan-headers: <vulkan/vulkan.h> for the runtime's Vulkan compute
          # path (the loader vulkan-1.dll is dlopen'd at run time, no link dep).
          # tar: used (with zstd) to unpack the fork toolchain in the fetch step.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-antlr4-runtime-cpp
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-xxhash
            mingw-w64-x86_64-glog
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-pkgconf
            tar
            vim
            zip

      # EVERY target links the cajeta-llvm FORK toolchain (LLVM 23 + clang +
      # lld) carrying the SPIR-V / SPV_KHR_ray_query patches — see plans/c0/.
      # Stock distro/brew/mingw LLVM can't build a correct cajeta (it now
      # references fork-only intrinsic enums), so there is NO fallback: the
      # fork publishes one toolchain per target (build-cajeta-llvm.yml) and
      # each leg fetches the asset matching its host.
      - name: Fetch prebuilt LLVM toolchain (from the cajeta-spirv fork)
        env:
          # Bump when re-cutting the toolchain (new pinned base or new SPIR-V
          # patches). r10 adds int_spv_dot4add_su8packed (OpSUDot, the mixed-
          # signedness packed dot the Vulkan integer tier lowers to) — without
          # it every target fails to BUILD, not to test:
          #   SpirvKernelLowering.cpp: 'spv_dot4add_su8packed' is not a member
          #   of 'llvm::Intrinsic'; did you mean 'spv_dot4add_u8packed'?
          # r6 adds Int64Atomics to the Vulkan/Shader flavor (64-bit
          # OpAtomic*); r4 was the first with all four targets.
          LLVM_RELEASE_TAG: cajeta-llvm-23-r10
        run: |
          set -euo pipefail
          # The fork names assets by host (asset_os), NOT by cajeta's target triple:
          # x86_64-linux-gnu -> linux-x64, aarch64-linux-gnu -> linux-arm64,
          # aarch64-apple-darwin -> macos-arm64, x86_64-w64-mingw32 -> windows-x64
          # (see build-cajeta-llvm.yml). Map first.
          case "${{ matrix.target }}" in
            x86_64-linux-gnu)     ASSET_OS=linux-x64 ;;
            aarch64-linux-gnu)    ASSET_OS=linux-arm64 ;;
            aarch64-apple-darwin) ASSET_OS=macos-arm64 ;;
            x86_64-w64-mingw32)   ASSET_OS=windows-x64 ;;
            *) echo "::error::no fork asset_os mapping for ${{ matrix.target }}"; exit 1 ;;
          esac
          ASSET="${LLVM_RELEASE_TAG}-${ASSET_OS}.tar.zst"
          URL="https://github.com/jklappenbach/cajeta-llvm/releases/download/${LLVM_RELEASE_TAG}/${ASSET}"
          # On the self-hosted Windows runner the MSYS2 shell's $HOME is '/'
          # (a read-only mount), so "$HOME/cajeta-llvm" -> '//cajeta-llvm' and
          # mkdir fails with "Read-only file system". Anchor the toolchain in
          # the (always-writable) workspace on Windows; $PWD is already in MSYS
          # '/c/...' form that cygpath -m/-w convert cleanly for the native
          # mingw CMake/PATH below. Linux/macOS hosted runners have a real
          # writable $HOME, so keep using it there.
          if [ "${{ runner.os }}" = "Windows" ]; then
            DEST="$PWD/cajeta-llvm"
          else
            DEST="$HOME/cajeta-llvm"
          fi
          mkdir -p "$DEST"
          # Bare relative filename: resolves in $CWD (the workspace) for BOTH
          # msys2's tools and the native mingw curl/zstd — avoids the MSYS
          # '/tmp' -> 'C:\tmp' translation trap when a native binary gets the path.
          curl -fsSL "$URL" -o llvm.tar.zst
          if [ "${{ runner.os }}" = "Windows" ]; then
            # mingw GNU tar's --zstd plugin lookup is unreliable; pipe zstd
            # explicitly (msys tar just reads the plain tarstream from stdin).
            # A native (mingw) CMake later can't resolve an MSYS '/home/...'
            # mount path, so emit LLVM_DIR / PATH in Windows (C:/ and C:\) form.
            zstd -dc llvm.tar.zst | tar -x -C "$DEST" --strip-components=1
            echo "LLVM_DIR=$(cygpath -m "$DEST")/lib/cmake/llvm" >> "$GITHUB_ENV"
            echo "$(cygpath -w "$DEST")\\bin" >> "$GITHUB_PATH"
          else
            tar --zstd -xf llvm.tar.zst -C "$DEST" --strip-components=1
            echo "LLVM_DIR=$DEST/lib/cmake/llvm" >> "$GITHUB_ENV"
            echo "$DEST/bin" >> "$GITHUB_PATH"
          fi

      # ---- macOS dependency install (brew) ------------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Homebrew on macOS-13 (Intel) is at /usr/local; on macos-14
          # (Apple Silicon) it's at /opt/homebrew. `brew --prefix`
          # abstracts that for us.
          brew update
          # No brew `llvm` here: macOS links the cajeta-spirv FORK toolchain
          # (fetched above, which sets LLVM_DIR), same as every other target —
          # stock LLVM lacks the fork-only SPIR-V intrinsics cajeta needs.
          # coreutils provides `gtimeout`: macOS has no GNU `timeout`, which
          # the test harness needs for its per-test wall-clock cap. Without it
          # the harness falls back to running tests untimed (a hang could stall
          # a worker), so install it to keep the timeout protection on macOS.
          brew install \
            cmake \
            ninja \
            antlr4-cpp-runtime \
            openjdk@21 \
            googletest \
            glog \
            zstd \
            zeromq \
            xxhash \
            coreutils \
            vulkan-headers \
            vulkan-loader
          # Apple's system clang doesn't know about the brew llvm headers/libs
          # unless we point CMake at the brew prefix explicitly.
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      # ---- Fetch the prebuilt IDE plugin for embedding ------------------
      # The `plugin` job built Cajeta's IDEA plugin once; drop its zip where
      # src/CMakeLists.txt's embed glob looks (ide-plugins/idea/build/
      # distributions/*.zip) so the Configure step below bakes it into the
      # binary. Non-fatal: if it's missing, the embed falls back to a stub and
      # `cajeta ide install` reports no bundled plugin (the compiler still ships).
      - name: Download IDE plugin (for embedding)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cajeta-plugin
          path: ide-plugins/idea/build/distributions

      # ---- Configure + build (all platforms) ----------------------------
      # setup.sh's dep-install logic is gated by CAJETA_SKIP_DEPS=1 here
      # because the dependency install already happened above per-platform.
      # The cmake configure that setup.sh runs is portable across all
      # three host paths (apt Linux, brew macOS, MSYS2 mingw-w64-cmake).
      # ---- glog, built static (Windows only) ----------------------------
      # Every other Windows dependency ships a static archive in MSYS2; glog
      # ships ONLY libglog.dll.a + libglog-2.dll (verified against the mingw64
      # repo 2026-09-07, package 0.7.1-10 — its file list has no .a). One
      # remaining DLL would defeat the whole point, because cvm installs a
      # SINGLE file and cannot carry a sidecar. So build glog from source with
      # BUILD_SHARED_LIBS=OFF and point find_package at it via glog_ROOT.
      # gflags/unwind are off: cajeta uses neither directly (only
      # src/cajeta/logging/CajetaLogger.cpp includes glog at all), and each
      # would drag another shared library back in.
      - name: Build glog static (Windows)
        if: runner.os == 'Windows' && env.CAJETA_STATIC_WINDOWS == 'ON'
        run: |
          set -euo pipefail
          # LLVM_DIR was put in GITHUB_ENV by the fetch step and is
          # <fork>/lib/cmake/llvm; the fork's clang is its sibling <fork>/bin.
          # Derived here as well as in Configure because this step runs first,
          # and glog MUST be built by the same compiler as cajeta or its
          # COMDATs will not match (that mismatch is the whole reason the g++
          # static link failed).
          FORK_ROOT="${LLVM_DIR%/lib/cmake/llvm}"
          GLOG_PREFIX="$PWD/.glog-static"
          if [ ! -f "$GLOG_PREFIX/lib/libglog.a" ]; then
            rm -rf .glog-src .glog-build "$GLOG_PREFIX"
            git clone --depth 1 --branch v0.7.1 https://github.com/google/glog .glog-src
            cmake -S .glog-src -B .glog-build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="${FORK_ROOT}/bin/clang.exe" \
              -DCMAKE_CXX_COMPILER="${FORK_ROOT}/bin/clang++.exe" \
              -DBUILD_SHARED_LIBS=OFF \
              -DWITH_GFLAGS=OFF -DWITH_UNWIND=none -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX="$GLOG_PREFIX"
            cmake --build .glog-build --target install
          fi
          [ -f "$GLOG_PREFIX/lib/libglog.a" ] \
            || { echo "::error::glog static build produced no libglog.a"; exit 1; }
          echo "glog_ROOT=$GLOG_PREFIX" >> "$GITHUB_ENV"
          echo "static glog at $GLOG_PREFIX"

      - name: Configure
        run: |
          set -euo pipefail
          export CAJETA_SKIP_DEPS=1
          # Windows links the cajeta-llvm fork (fetched above). Build cajeta's C++
          # with mingw g++, NOT the fork's clang++ — the fork bin is first on PATH,
          # so CMake would auto-pick clang++, which on mingw doesn't auto-link
          # winpthreads and fails the LLVM/libstdc++ pthread_* symbols at link. The
          # fork still supplies the LLVM libs/headers + clang for the bitcode step.
          # The kernel transport is a RELEASE capability: fail configure if
          # libzmq is missing rather than shipping a kernel-less binary
          # (v0.21.0/v0.21.1 both did, silently).
          CMAKE_EXTRA=("-DCAJETA_REQUIRE_ZMQ=ON")
          if [ "${{ runner.os }}" = "Windows" ]; then
            # The fork's OWN clang, not MSYS2's: installing mingw clang would
            # put a stock LLVM 22 on the lib search path, which is the "two
            # LLVMs" trap this leg's package list deliberately avoids. cajeta
            # must be compiled by the same C++ toolchain that built the fork's
            # LLVM archives (clang) or a static link cannot merge their COMDATs
            # — the gcc build failed on exactly that. Measured 2026-09-09: the
            # fork's clang++ compiles the whole tree with zero errors.
            _FORK="${LLVM_DIR%/lib/cmake/llvm}"
            export CC="${_FORK}/bin/clang.exe" CXX="${_FORK}/bin/clang++.exe"
            # Passed explicitly rather than left to the CMake default, so the
            # job-level switch is the single source of truth for both this and
            # the glog step above.
            CMAKE_EXTRA+=("-DCAJETA_STATIC_WINDOWS=${CAJETA_STATIC_WINDOWS}")
            # This self-hosted runner reuses build/ across runs, and CMake
            # caches every find_ result. setup-msys2 (update: true) can move
            # the toolchain between runs while cached include/lib paths keep
            # pointing at the OLD msys2 (or at C:/msys64 from before the
            # active-prefix fix) — which is how the v0.21.0 leg mixed two
            # mingw runtimes and died in <stdlib.h>. Reconfigure fresh; the
            # object cache is unaffected and a toolchain move forces a full
            # recompile anyway.
            rm -rf build/CMakeCache.txt build/CMakeFiles
            # Pin the runtime-bitcode clang to the cajeta-llvm FORK (LLVM 23).
            # The fork's relocated LLVMConfig.cmake exports a stale
            # LLVM_TOOLS_BINARY_DIR (a build-machine path that doesn't exist
            # here), so src/CMakeLists.txt's find_program falls through to
            # MSYS2's clang (LLVM 22) and hard-fails the toolchain-major check.
            # LLVM_DIR (set by the fetch step) is <fork>/lib/cmake/llvm, so the
            # fork's clang is its sibling <fork>/bin/clang.exe. Pre-seeding the
            # CAJETA_CLANG cache var makes find_program a no-op (documented
            # escape hatch in the error message itself).
            FORK_ROOT="${LLVM_DIR%/lib/cmake/llvm}"
            CMAKE_EXTRA+=("-DCAJETA_CLANG=${FORK_ROOT}/bin/clang.exe")
            # llvm-link merges the runtime bitcode and MUST be the same LLVM
            # major as the clang that emitted it (LLVM 23). Pin it to the fork's
            # too: this self-hosted runner reuses its workspace, so a prior
            # configure can leave CAJETA_LLVM_LINK cached as MSYS2's llvm-link
            # (LLVM 22) in build/CMakeCache.txt, which then can't read the
            # LLVM-23 bitcode ("Not an int attribute ... Reader: 'LLVM 22'").
            CMAKE_EXTRA+=("-DCAJETA_LLVM_LINK=${FORK_ROOT}/bin/llvm-link.exe")
          fi
          ./setup.sh "${CMAKE_EXTRA[@]+"${CMAKE_EXTRA[@]}"}"

      - name: Build
        run: cmake --build build --config Release -- -j 4

      # ---- Smoke test: cajeta --version must succeed --------------------
      - name: Smoke test
        run: |
          ./build/src/cajeta --version
          ./build/src/cajeta --version --verbose

      # ---- Run the release regression subset ----------------------------
      #
      # NOT the full ~1725-test battery — running that on all four matrix
      # targets is too expensive, and most of it is the host-independent
      # front-end (parser/typer/borrow-checker), which can't regress due to
      # cross-compilation. release_tests.sh runs only the curated subset in
      # test/release_filter.txt: the back-end/runtime areas that lower
      # differently per ISA/OS/endianness/ABI (numeric intrinsics, byte
      # serialization + .cja archive format, struct/view layout, atomics,
      # TLS + drop chain, async/fibers, threading, OS/file I/O) plus a thin
      # codegen/dispatch smoke. NO_BUILD=1 — the Build step above already
      # built the tree; the script just runs against it (sharded).
      #
      # HARD GATE on ALL FOUR targets. A failing release-test run fails the
      # leg (and the run) — no exceptions. The earlier per-target masking
      # (continue-on-error on the non-x86 legs) hid genuine JIT lowering bugs:
      # the aarch64 sret call-site ABI crash, the macOS missing-fp128-builtins
      # materialization failure, and the Windows fabsf / hash_float128 ABI
      # failures all shipped "green" under it. Those are now fixed at the
      # source (not masked), so every leg gates honestly. NOTE: `continue-on-
      # error` does NOT just skip the failure — it also rewrites the step's
      # `conclusion` to `success` (only `outcome` stays `failure`), so a masked
      # leg looks green in the API too. Keep this a hard gate.
      - name: Run release tests
        env:
          # TEST_TIMEOUT is a HANG bound, not a speed limit — a healthy test
          # killed mid-progress is a false red, and the only honest floor is
          # one no healthy test can reach on the SLOWEST runner in the matrix.
          #
          # Windows got 300 first (JIT compiles ~40-60s each there vs ~15s on
          # macOS, ~5s on a fast Linux box). That fixed Windows and left every
          # other leg at 120 — which is calibrated to a developer workstation,
          # not to GitHub's shared runners. Both Linux legs then failed the
          # v0.18.0 dry-run with 73 and 79 timeouts, ZERO failures and ZERO
          # crashes, every one killed at 120s after running 129-162s: healthy
          # tests, still progressing, shot by the floor (ParallelStreamP1Tests
          # and friends, which spawn and are slow on any hardware).
          #
          # So the floor is 300 everywhere. A genuine hang still trips it; a
          # slow-but-healthy test on a small runner no longer does. Note the
          # budget is per-test max(TEST_TIMEOUT, measured * BATCH_SLACK), so
          # tests with recorded history already scale above this.
          TEST_TIMEOUT: 300
          # Shared test run: BATCH=1 runs each suite as ONE process and reuse
          # (default-on in cajeta_tests.sh's parallel path) primes the ~14s stdlib
          # ONCE per suite instead of once per test. This helps MOST where the
          # prime dominates — the Windows JIT (~40-60s/compile) — turning the gate
          # from a per-test re-prime grind into a per-suite amortized run. Reuse is
          # crash-safe (per-test fallback on any suite crash; auto-fallback on any
          # reuse hazard), so a suite that destabilizes still degrades to per-test.
          BATCH: "1"
        run: |
          set -euo pipefail
          TESTS="${{ github.event_name == 'workflow_dispatch' && inputs.tests || '' }}"
          if [ -n "$TESTS" ]; then
            # Targeted iteration: run ONLY the named suites, raw runner, no
            # release-filter drift guard. Never a substitute for the full
            # subset on a tag cut — the tag path ignores this input.
            TENV="${{ github.event_name == 'workflow_dispatch' && inputs.test_env || '' }}"
            if [ -n "$TENV" ]; then
              echo ">> targeted env: $TENV"
              # shellcheck disable=SC2086
              export $TENV
            fi
            echo ">> targeted test run: $TESTS"
            # PARALLEL=1 even for a filtered run: the parallel path runs each
            # test in ITS OWN process with crash isolation and per-test logs —
            # a hard native death (the COFF exit-127 class) then names the
            # dying test in the summary instead of swallowing the whole
            # suite's buffered stdout.
            # shellcheck disable=SC2086
            NO_BUILD=1 KEEP_LOGS=run-logs PARALLEL=1 ./cajeta_tests.sh $TESTS
          else
            NO_BUILD=1 KEEP_LOGS=run-logs ./release_tests.sh
          fi

      # Persist the raw per-shard test output (full gtest failure text +
      # crash markers, kept by KEEP_LOGS above) as an artifact. if: always()
      # — the logs matter MOST when the test step failed, and on non-primary
      # targets that failure is masked by continue-on-error, leaving the
      # step's compact summary (test names only) as the sole trace. With the
      # artifact, a red/masked leg can be diagnosed from the run page without
      # reproducing on that platform.
      - name: Upload test run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.target }}
          path: run-logs/
          if-no-files-found: ignore
          retention-days: 14

      # ---- Provision the installer toolchain ----------------------------
      # WiX Toolset for the Windows MSI. Pinned to v5: v6/v7 require accepting
      # the Open Source Maintenance Fee (OSMF) EULA. CPack's WIX generator uses
      # the modern `wix` CLI (CPACK_WIX_VERSION >= 4, set in CPackOptions.cmake).
      # dotnet is preinstalled on windows-latest; the UI extension is needed by
      # the CPack-generated authoring. Append the tools dir to PATH for later
      # steps (msys2 inherits the Windows PATH, so the bash cpack step sees wix).
      - name: Provision WiX (Windows)
        if: runner.os == 'Windows'
        # NOT continue-on-error: a WiX provisioning failure must red the run.
        # This step was previously masked, which is exactly how "pwsh: command
        # not found" shipped as a false-green (no MSI ever produced).
        # Windows PowerShell (powershell.exe, 5.1) — NOT pwsh. The GitHub-hosted
        # windows-latest image ships PowerShell Core (`pwsh`), but the
        # self-hosted PHOENIX runner only has the OS-bundled Windows PowerShell.
        # With `shell: pwsh` the shell itself fails to launch ("pwsh: command
        # not found"), so the whole step body never runs, WiX is never
        # installed, and the later `cpack -G WIX` fails too — both masked by
        # continue-on-error, producing a false-green run with no MSI. The script
        # below is 5.1-compatible.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # `dotnet tool update` (NOT install): the runner service profile
          # (NT AUTHORITY\NETWORK SERVICE) persists between runs, so `install`
          # would exit non-zero with "already installed" on every re-dispatch
          # after the first and — now that this step hard-gates — red the run.
          # `update --version 5.0.2` is idempotent: installs if absent, no-op
          # success if already at 5.0.2. SDK 9.0.x + .NET 6 runtime are present
          # on the runner, which is what WiX v5 (net6.0) needs.
          dotnet tool update --global wix --version 5.0.2
          # The global-tools dir is NOT on this session's PATH yet — on the
          # first dotnet run the SDK even prints "you will need to reopen the
          # Command Prompt window before running the tool you installed", and
          # $GITHUB_PATH only takes effect in LATER steps, not this shell. So
          # `wix extension add` on the next line failed with "'wix' is not
          # recognized". Prepend the tools dir to the CURRENT $env:PATH so `wix`
          # is callable within this same step.
          $toolsDir = "$env:USERPROFILE\.dotnet\tools"
          $env:PATH = "$toolsDir;$env:PATH"
          # Re-adding an already-present extension is a no-op success.
          wix extension add -g WixToolset.UI.wixext/5.0.2
          # Persist the tools dir for the later cpack step. Add-Content (not
          # Out-File -Encoding utf8): Windows PowerShell 5.1's utf8 writer
          # prepends a BOM, which corrupts the first GITHUB_PATH entry so `wix`
          # wouldn't be found by the next step. Add-Content defaults to BOM-free
          # ASCII, and the path is pure ASCII anyway.
          Add-Content -Path $env:GITHUB_PATH -Value $toolsDir

      # ---- Build native installers (CPack) ------------------------------
      # Wraps the CMake install() tree (top-level CMakeLists.txt §3) into the
      # platform-native format(s). Linux: .deb + .rpm (both arches via the
      # respective runners); Windows: .msi; macOS: .pkg (productbuild). The
      # generic .tar.gz/.zip is still hand-staged below as the Tier-0 artifact.
      # Runs in every mode (incl. dry-run) — the release-publish job is what
      # gates on mode, so dry-run still produces + uploads installers.
      #
      # NOTE: the Linux .deb/.rpm dependency lists are only fully correct once
      # the D2 Linux static-link lands (plan §3/§1); until then they may declare
      # libLLVM. The package *shape* is produced and uploaded regardless.
      - name: Build native installers
        id: installers
        # Non-fatal for now: the installer formats aren't validated end-to-end
        # yet (D2 Linux static-link + §4 clean-container install-test + §6 macOS
        # path/signing are still open). Producing them must NOT red the existing
        # tarball release. Flip to a hard gate per-target as each is validated.
        continue-on-error: true
        run: |
          set -euo pipefail
          cd build
          case "${{ runner.os }}" in
            Linux)
              cpack -G DEB
              cpack -G RPM
              ;;
            macOS)
              cpack -G productbuild
              ;;
            Windows)
              cpack -G WIX
              ;;
          esac
          echo "Produced installers:"
          ls -la *.deb *.rpm *.msi *.pkg 2>/dev/null || true

      # ---- Verify the Windows installer actually built -------------------
      # "Build native installers" stays continue-on-error because the Linux
      # (.deb/.rpm) and macOS (.pkg) formats aren't validated end-to-end yet and
      # must not red those (green) legs. But the Windows MSI path IS expected to
      # work now, so gate it explicitly: if cpack -G WIX produced no .msi (e.g.
      # WiX missing, or the cpack step silently failed under continue-on-error),
      # fail the run instead of shipping a false green. Windows-only — does not
      # touch the Linux/macOS legs' tolerance.
      - name: Verify Windows installer (MSI)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          shopt -s nullglob
          msis=(build/*.msi)
          if [ ${#msis[@]} -eq 0 ]; then
            echo "::error::cpack -G WIX produced no .msi — the Windows installer build failed (previously masked by continue-on-error)."
            exit 1
          fi
          echo "Windows MSI(s) produced:"
          ls -la "${msis[@]}"

      # ---- Verify the Linux + macOS installers actually built -------------
      # The same gate the MSI got, now that v0.25.0 has shipped all four
      # formats: the build step stays continue-on-error (so a future format
      # can be added without reddening the leg), and these decide whether the
      # leg is allowed to pass. Without them a cpack failure is invisible —
      # the step swallows it and `fail_on_unmatched_files: false` on the
      # upload swallows the absence, so the release goes green missing a
      # package nobody notices until an install fails.
      - name: Verify Linux installers (deb + rpm)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(build/*.deb)
          rpms=(build/*.rpm)
          missing=()
          if [ ${#debs[@]} -eq 0 ]; then missing+=(".deb"); fi
          if [ ${#rpms[@]} -eq 0 ]; then missing+=(".rpm"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::cpack produced no ${missing[*]} — the Linux installer build failed (masked by continue-on-error on the build step)."
            exit 1
          fi
          echo "Linux installers produced:"
          ls -la "${debs[@]}" "${rpms[@]}"

      - name: Verify macOS installer (pkg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(build/*.pkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::cpack -G productbuild produced no .pkg — the macOS installer build failed (masked by continue-on-error on the build step)."
            exit 1
          fi
          echo "macOS installer(s) produced:"
          ls -la "${pkgs[@]}"

      # ---- Package ------------------------------------------------------
      # MSYS2 ships bash + tar + zip, so the staging and archive logic
      # is uniform across all three platforms. cajeta the binary lands
      # at build/src/cajeta on Linux/macOS and build/src/cajeta.exe
      # under MSYS2 (mingw32-make / ninja produce .exe automatically).
      - name: Stage release contents
        run: |
          set -euo pipefail
          # nullglob: with a static Windows link there are no DLLs, and an
          # unmatched glob must expand to nothing rather than to itself.
          shopt -s nullglob
          V="${{ steps.version.outputs.ref_version }}"
          T="${{ matrix.target }}"
          STAGE="cajeta-v${V}-${T}"
          mkdir -p "$STAGE/bin" "$STAGE"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # cajeta.exe is NOT self-contained on Windows. D2 chose to reach
            # self-containedness there by BUNDLING the MinGW DLLs rather than
            # static-linking, and only the MSI ever did it — CPack runs the
            # install() rules, and install(RUNTIME_DEPENDENCY_SET) resolves the
            # import table. A bare `cp` of the exe shipped an archive that dies
            # at load time on any host without MSYS2 on PATH:
            #   "The code execution cannot proceed because libzmq.dll was not
            #    found." (measured on the shipped v0.27.0 zip; the exe imports
            #    11 non-system DLLs — libzmq is just the first one named.)
            # So stage through the SAME install rules the MSI uses and take
            # their bin/, which carries the exe plus every resolved DLL.
            # With CAJETA_STATIC_WINDOWS=ON (the default) there are no DLLs to
            # carry — the exe imports only Windows system libraries — so the
            # glob is allowed to match nothing. The copy stays because it is
            # what makes a CAJETA_STATIC_WINDOWS=OFF build shippable too, and
            # the import-table gate below is what actually decides either way.
            rm -rf .stage-install
            cmake --install build --prefix .stage-install --component cajeta
            cp .stage-install/bin/cajeta.exe "$STAGE/bin/"
            dlls=(.stage-install/bin/*.dll)
            if [ ${#dlls[@]} -gt 0 ]; then
              cp "${dlls[@]}" "$STAGE/bin/"
              echo "staged ${#dlls[@]} bundled DLL(s) beside cajeta.exe"
            else
              echo "no DLLs to bundle — cajeta.exe is statically linked"
            fi
          else
            cp build/src/cajeta "$STAGE/bin/"
          fi
          cp VERSION README.md "$STAGE/"
          [ -f LICENSE ] && cp LICENSE "$STAGE/" || true
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"

      # Gate: the staged Windows tree must be loadable on a host with no MSYS2.
      # v0.27.0 shipped a zip holding cajeta.exe alone; it dies in the loader
      # before main(), so no test that RUNS the binary on the build host (which
      # has MSYS2 on PATH) can see it. Read the import table instead and assert
      # every non-system DLL sits beside the exe. Asserting the gate FIRES:
      # revert the staging step above to `cp build/src/cajeta.exe` and this
      # step fails, listing libzmq.dll among the missing.
      - name: Verify the staged Windows tree carries its DLLs
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          shopt -s nullglob
          EXE="$STAGE_DIR/bin/cajeta.exe"
          [ -f "$EXE" ] || { echo "::error::no $EXE to verify"; exit 1; }
          missing=0
          while read -r dll; do
            case "$dll" in
              # Shipped by Windows itself — must NOT be bundled.
              api-ms-*|ext-ms-*|[Kk][Ee][Rr][Nn][Ee][Ll]32.dll|[Nn][Tt][Dd][Ll][Ll].dll) continue ;;
            esac
            if [ -f "$STAGE_DIR/bin/$dll" ]; then continue; fi
            # A system DLL resolves out of System32; anything else must be beside the exe.
            if [ -f "/c/Windows/System32/$dll" ]; then continue; fi
            echo "::error::$dll is imported by cajeta.exe but is neither bundled nor a system DLL"
            missing=$((missing + 1))
          done < <(objdump -p "$EXE" | sed -n 's/^\s*DLL Name:\s*//p' | sort -u)
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing unbundled import(s) — this archive would fail at load time off-runner"
            exit 1
          fi
          bundled=("$STAGE_DIR/bin/"*.dll)
          echo "all imports satisfied (${#bundled[@]} DLL(s) bundled beside the exe)"

      # ---- cvm download asset (D12) ------------------------------------
      # cvm installs the BARE binary — it writes the downloaded bytes
      # straight to ~/.cajeta/versions/<ver>/cajeta and chmod +x, with no
      # tar/zip extractor. So publish the raw executable per target (named
      # by triple) plus its SHA-256 in a small `<triple>.cvmmeta` metadata
      # file that the release job folds into index.json (the cvm manifest).
      - name: Stage cvm download asset + checksum
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.ref_version }}"
          T="${{ matrix.target }}"
          mkdir -p cvm-dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=build/src/cajeta.exe
            ASSET="cajeta-v${V}-${T}.exe"
          else
            BIN=build/src/cajeta
            ASSET="cajeta-v${V}-${T}"
          fi
          cp "$BIN" "cvm-dist/${ASSET}"
          if command -v sha256sum >/dev/null 2>&1; then
            SHA=$(sha256sum "cvm-dist/${ASSET}" | cut -d' ' -f1)
          else
            SHA=$(shasum -a 256 "cvm-dist/${ASSET}" | cut -d' ' -f1)
          fi
          printf '%s\t%s\t%s\n' "$T" "$ASSET" "$SHA" > "cvm-dist/${T}.cvmmeta"
          echo "cvm asset: ${ASSET}  sha256=${SHA}"

      # ---- cvm itself (D12) --------------------------------------------
      # The step above ships the COMPILER that cvm installs. This one ships
      # cvm. Without it the install story circles: the guide says "use cvm",
      # getting cvm means building from source, and building from source
      # needs the compiler cvm exists to install.
      #
      # cvm is written in Cajeta and compiled by the compiler this leg just
      # built — dogfooding, and the reason this can't move to its own job.
      # tools/cvm/cajeta.json declares `target: host` and every matrix leg
      # runs natively on its own triple, so the matrix yields one cvm per
      # platform with no cross-compilation.
      #
      # Published as a BARE executable like the compiler asset: cvm bootstraps
      # a machine that has nothing, so the download has to run after chmod +x
      # with no extractor in the picture.
      - name: Build cvm
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.ref_version }}"
          T="${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            CAJETA="$PWD/build/src/cajeta.exe"
            ASSET="cvm-v${V}-${T}.exe"
          else
            CAJETA="$PWD/build/src/cajeta"
            ASSET="cvm-v${V}-${T}"
          fi
          [ -x "$CAJETA" ] || { echo "::error::no compiler at $CAJETA to build cvm with"; exit 1; }

          # `cajeta <task>` runs the named cajeta.json task. `release` is the
          # optimized flavor; the default `build` task is debug.
          ( cd tools/cvm && "$CAJETA" release )

          # output-path is build/cvm. Whether a .exe suffix lands on it is the
          # host toolchain's call, so accept either.
          BUILT=""
          for c in tools/cvm/build/cvm tools/cvm/build/cvm.exe; do
            [ -f "$c" ] && { BUILT="$c"; break; }
          done
          if [ -z "$BUILT" ]; then
            echo "::error::cvm build left no binary in tools/cvm/build"
            ls -laR tools/cvm/build || true
            exit 1
          fi

          mkdir -p cvm-dist
          cp "$BUILT" "cvm-dist/${ASSET}"
          chmod +x "cvm-dist/${ASSET}" || true
          if command -v sha256sum >/dev/null 2>&1; then
            SHA=$(sha256sum "cvm-dist/${ASSET}" | cut -d' ' -f1)
          else
            SHA=$(shasum -a 256 "cvm-dist/${ASSET}" | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "$SHA" "$ASSET" > "cvm-dist/${ASSET}.sha256"
          # Read by the release job to give cvm its own entry in index.json,
          # so `cvm self update` has a manifest to resolve against.
          printf '%s\t%s\t%s\n' "$T" "$ASSET" "$SHA" > "cvm-dist/${T}.cvmselfmeta"
          echo "cvm binary: ${ASSET}  sha256=${SHA}"

      - name: Archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"

      - name: Archive (zip)
        if: matrix.archive_ext == 'zip'
        run: |
          # MSYS2 MINGW64 ships neither `zip` (not guaranteed in the install
          # list across runners) nor `python` on this runner, so use cmake's
          # bundled libarchive: cmake is guaranteed present (it just built the
          # project) and `-E tar --format=zip` writes a portable .zip. Same
          # layout the old python make_archive produced: a top-level
          # ${STAGE_DIR}/ folder.
          cmake -E tar cf "${STAGE_DIR}.zip" --format=zip "${STAGE_DIR}"

      # ---- Arch package — NOT WIRED, blocked on D2 -----------------------
      # The PKGBUILD (packaging/arch/cajeta-bin/) is written and was validated
      # locally end to end: makepkg builds it, the payload and symlink are
      # right, and `pacman -U` installs it in a clean archlinux:latest.
      #
      # Then `cajeta --version` dies:
      #   error while loading shared libraries: libantlr4-runtime.so.4.10
      #
      # `ldd` on the SHIPPED v0.25.0 binary confirms it: antlr4, zstd, glog,
      # OpenSSL, curl, zmq, gflags, libunwind are all dynamic. The .deb/.rpm
      # survive because SHLIBDEPS/AUTOREQ generate their dep lists; a
      # hand-written Arch `depends=` cannot, because `.so.4.10` is a
      # Debian-versioned soname that Arch does not ship at all.
      #
      # So this is blocked on D2 (self-contained linking), not on a bug in the
      # packaging. Re-add the three steps — build, gate, install-test — from
      # git history when D2 lands; the release globs below already carry
      # *.pkg.tar.zst.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-${{ matrix.target }}
          path: |
            cajeta-v${{ steps.version.outputs.ref_version }}-${{ matrix.target }}.tar.gz
            cajeta-v${{ steps.version.outputs.ref_version }}-${{ matrix.target }}.zip
            cvm-dist/*
            build/*.deb
            build/*.rpm
            build/*.msi
            build/*.pkg
            build/*.pkg.tar.zst
            build/*.sha256
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Publish ONLY when every build leg succeeded. A release is an all-or-
    # nothing set — shipping a tag with a missing target (or, worse, marking
    # it "latest" with only the IDE plugin because the compiler legs failed)
    # is actively harmful: cvm would resolve a manifest with no/partial
    # binaries. `needs.build.result == 'success'` is true only if all matrix
    # legs passed; `always()` keeps this evaluable rather than auto-skipped.
    if: always() && needs.build.result == 'success'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-derive release params
        id: params
        shell: bash
        run: |
          set -euo pipefail
          # Same derivation as the build job's `Read VERSION` step.
          # Re-doing it here (rather than passing job outputs) keeps each
          # job's logic self-contained and avoids matrix→single-job
          # output forwarding awkwardness.
          if [ -f VERSION ]; then
            V=$(cat VERSION | tr -d '[:space:]')
          else
            V="0.0.0-untagged"
          fi
          MODE="${{ github.event_name == 'push' && 'production' || inputs.mode }}"
          if [ "$MODE" = "production" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$V"
            fi
            REL_NAME="cajeta $TAG"
          else
            TAG=""
            REL_NAME=""
          fi
          # ref_version mirrors the build job: the version without a leading
          # 'v', used in the cvm asset filenames + the manifest `version`.
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF_NAME#v}"
          else
            REF="$V"
          fi
          # Pre-release detection: a semver pre-release suffix (the `-` in
          # `v0.7.0-rc1`, `-beta1`, etc.) means this must NOT be marked the
          # "latest" release. Computed explicitly rather than relying on the
          # release action's auto-detection, which has proven unreliable.
          case "$TAG" in
            *-*) PRERELEASE="true" ;;
            *)   PRERELEASE="false" ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref_version=$REF" >> "$GITHUB_OUTPUT"
          echo "release_name=$REL_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show staged artifacts
        run: ls -laR artifacts

      # ---- cvm manifest (index.json) -----------------------------------
      # Fold every build job's `<triple>.cvmmeta` (triple, asset filename,
      # sha256) into one self-describing per-release manifest cvm fetches
      # via the stable `releases/{latest,download/<tag>}/download/index.json`
      # URL. Also collects the raw per-triple binaries cvm downloads. The
      # manifest + binaries upload only on production (the release step is
      # gated on mode), but assembling always lets dry-run inspect it.
      - name: Assemble cvm manifest (index.json)
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.params.outputs.ref_version }}"
          TAG="${{ steps.params.outputs.tag }}"
          # Dry-run has no tag; use the would-be tag so URLs are well-formed.
          [ -n "$TAG" ] || TAG="v${V}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          mkdir -p release-assets
          ASSETS=""
          while IFS=$'\t' read -r T ASSET SHA; do
            [ -n "$T" ] || continue
            ENTRY="\"${T}\": { \"url\": \"${BASE}/${ASSET}\", \"sha256\": \"${SHA}\" }"
            if [ -z "$ASSETS" ]; then ASSETS="$ENTRY"; else ASSETS="${ASSETS}, ${ENTRY}"; fi
          done < <(find artifacts -type f -name '*.cvmmeta' -exec cat {} + 2>/dev/null | sort)
          if [ -z "$ASSETS" ]; then
            echo "::warning::no .cvmmeta files found — skipping cvm manifest"
            exit 0
          fi
          # cvm's OWN binaries, keyed the same way under a separate `cvm` key.
          # Additive and optional: a schemaVersion-1 reader that doesn't know
          # the key ignores it, so this stays inside the version contract while
          # giving `cvm self update` a manifest to resolve against.
          CVM=""
          while IFS=$'\t' read -r T ASSET SHA; do
            [ -n "$T" ] || continue
            ENTRY="\"${T}\": { \"url\": \"${BASE}/${ASSET}\", \"sha256\": \"${SHA}\" }"
            if [ -z "$CVM" ]; then CVM="$ENTRY"; else CVM="${CVM}, ${ENTRY}"; fi
          done < <(find artifacts -type f -name '*.cvmselfmeta' -exec cat {} + 2>/dev/null | sort)
          if [ -n "$CVM" ]; then
            printf '{ "schemaVersion": 1, "version": "%s", "assets": { %s }, "cvm": { %s } }\n' \
              "$V" "$ASSETS" "$CVM" > release-assets/index.json
          else
            echo "::warning::no .cvmselfmeta files found — index.json will carry no cvm entry"
            printf '{ "schemaVersion": 1, "version": "%s", "assets": { %s } }\n' \
              "$V" "$ASSETS" > release-assets/index.json
          fi
          echo "=== index.json ==="; cat release-assets/index.json
          # The bare binaries cvm downloads (raw exe per triple — not the
          # tarballs/zips, which cvm can't extract), plus cvm itself and the
          # checksum files that go beside it.
          find artifacts -type f \( -name 'cajeta-v*' -o -name 'cvm-v*' \) \
            ! -name '*.tar.gz' ! -name '*.zip' -exec cp {} release-assets/ \;
          echo "=== release-assets ==="; ls -la release-assets

      - name: Create / update GitHub Release
        # Skip on dry-run: artifacts uploaded by the build job stay
        # available as Actions artifacts (downloadable from the workflow
        # run page, 90-day default expiry), but no public Release or
        # git tag is created. That's the whole point of dry-run mode.
        #
        # Pre-releases: a `-`-suffixed semver tag (`v0.7.0-rc1`) is marked
        # prerelease and explicitly kept off "latest" via make_latest. We set
        # both flags explicitly (steps.params.outputs.prerelease) rather than
        # trusting the action's auto-detection, which published a `-rc1` tag
        # as "latest" in practice.
        if: steps.params.outputs.mode != 'dry-run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag }}
          name: ${{ steps.params.outputs.release_name }}
          prerelease: ${{ steps.params.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.params.outputs.prerelease != 'true' }}
          body: |
            Automated release of cajeta `${{ steps.params.outputs.tag }}`.

            See `RELEASING.md` for the supported binary targets and
            artifact shape. Pre-1.0 versions are subject to non-backward-
            compatible changes between minor releases.
          fail_on_unmatched_files: false
          files: |
            artifacts/**/cajeta-v*.tar.gz
            artifacts/**/cajeta-v*.zip
            artifacts/**/cajeta-idea-*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.pkg
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.sha256
            release-assets/index.json
            release-assets/cajeta-v*
            release-assets/cvm-v*

      # ---- keep the docs pointing at the release just published ---------
      # README's version line and the download tables in README + the install
      # guide were hand-maintained, so they drifted behind the tag. Regenerate
      # them from `release-assets/` — what the release actually carries, not
      # what the matrix hoped to build — and commit to main.
      #
      # Dry-run stops at the diff and prints it. A prerelease is skipped too:
      # `v0.3.0-rc1` is not what a reader landing on the README should be
      # pointed at.
      - name: Update README + install guide from the release
        if: steps.params.outputs.prerelease != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.params.outputs.tag }}"
          # Dry-run has no tag; use the would-be one so the preview is real.
          [ -n "$TAG" ] || TAG="v${{ steps.params.outputs.ref_version }}"
          chmod +x scripts/update-release-docs.sh
          # Both trees: release-assets holds the bare binaries, artifacts the
          # per-leg archives.
          scripts/update-release-docs.sh "$TAG" release-assets artifacts
          git --no-pager diff -- README.md docs/guide/01-installation.md
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit the docs update
        if: steps.params.outputs.mode != 'dry-run' && steps.params.outputs.prerelease != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs/guide/01-installation.md; then
            echo "::notice::docs already match ${{ steps.params.outputs.tag }} — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/guide/01-installation.md
          git commit -m "docs: release links for ${{ steps.params.outputs.tag }} [skip ci]"
          # The tag was built from a commit on main, but main may have moved
          # while the matrix ran. Rebase onto it rather than force-pushing
          # over whatever landed in the meantime.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Dry-run summary
        if: steps.params.outputs.mode == 'dry-run'
        run: |
          echo "::notice::Dry-run complete. No Release created, no git tag pushed."
          echo "::notice::Artifacts uploaded as workflow artifacts only — download from the run page (90-day expiry)."
