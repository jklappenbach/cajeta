# Release workflow. Triggered when a tag matching v* lands on origin.
# Cross-builds the cajeta compiler for every supported target, then
# attaches the artifacts to the matching GitHub Release. The full flow
# and supported targets are documented in RELEASING.md.
#
# Non-trivial parts called out in inline comments:
#   - macOS jobs install LLVM via Homebrew and pass LLVM_DIR explicitly
#     to CMake (brew doesn't put LLVM on the default search path).
#   - Windows uses Chocolatey for LLVM 20 + vcpkg for ANTLR4 runtime
#     (apt-style "everything in one place" isn't available there).
#   - The build matrix is `fail-fast: false` so a flaky transient on
#     one target doesn't take down the whole release.
#   - RISC-V is not yet wired — cross-compilation needs a riscv64
#     sysroot with LLVM + ANTLR4 + zstd already provisioned. Tracked
#     in RELEASING.md as best-effort / future.

name: release

# Three ways to trigger:
#
#   1. Push a `v*` tag — full production release. Always.
#      `git tag v0.1.1 && git push origin v0.1.1`
#
#   2. Actions UI → "release" → "Run workflow", mode = staging.
#      Builds + tests, publishes a PRE-RELEASE at
#      `staging-<VERSION>-<run-number>`. Useful for handing out
#      early-access binaries or verifying the publish path without
#      cutting a "latest" release. Doesn't show as latest on the
#      repo page.
#
#   3. Actions UI → "release" → "Run workflow", mode = dry-run.
#      Builds + tests every target, skips the Release publish step
#      entirely. Use to verify the matrix works without touching
#      the public surface. Default mode when triggered manually.
#
#   4. (Bonus.) Actions UI → "release" → "Run workflow",
#      mode = production. Equivalent to a `v*` tag push but
#      triggered from the UI — reads VERSION at run time, creates
#      the tag, publishes as latest. For when you don't want to do
#      the local tag dance.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'dry-run'
        options:
          - dry-run
          - staging
          - production

permissions:
  contents: write   # needed for softprops/action-gh-release to create / update the Release

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            archive_ext: tar.gz
            shell: bash
          - os: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            archive_ext: tar.gz
            shell: bash
          # x86_64-apple-darwin removed from the matrix: GitHub-hosted
          # macos-13 (Intel) runners are scarce + slow to dispatch
          # (Apple stopped selling Intel Macs in 2022; runner pool is
          # being wound down). Intel Mac users build from source —
          # documented in RELEASING.md.
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            shell: bash
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            shell: pwsh

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Fetch the full history so CMake's git rev-parse can stamp the
          # short hash into the binary. Shallow clones produce a "unknown"
          # hash, which is allowed but defeats the point.
          fetch-depth: 0

      - name: Read VERSION + derive release mode/tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -f VERSION ]; then
            V=$(cat VERSION | tr -d '[:space:]')
          else
            V="0.0.0-untagged"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

          # The dispatched mode (dry-run / staging / production); a tag
          # push always counts as production. The artifact name uses the
          # ref version when present so it lines up with the Release URL.
          MODE="${{ github.event_name == 'push' && 'production' || inputs.mode }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "production" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              # Tag push — ref version is authoritative.
              REF_TAG="${GITHUB_REF_NAME#v}"
              TAG="${GITHUB_REF_NAME}"
            else
              # Manual production trigger — derive from VERSION.
              REF_TAG="$V"
              TAG="v$V"
            fi
            PRERELEASE=false
            REL_NAME="cajeta $TAG"
          elif [ "$MODE" = "staging" ]; then
            # Staging: prerelease at `staging-<version>-<run-number>`.
            # Run number disambiguates multiple staging cuts of the
            # same VERSION (e.g. two attempts at v0.1.1 hardening).
            REF_TAG="$V-staging-${{ github.run_number }}"
            TAG="staging-$V-${{ github.run_number }}"
            PRERELEASE=true
            REL_NAME="cajeta staging $V (run ${{ github.run_number }})"
          else
            # Dry-run: still compute an artifact name so the upload step
            # works, but the release-publish job will short-circuit.
            REF_TAG="$V-dryrun-${{ github.run_number }}"
            TAG=""
            PRERELEASE=false
            REL_NAME=""
          fi

          echo "ref_version=$REF_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=$REL_NAME" >> "$GITHUB_OUTPUT"

          echo "::notice::release mode = $MODE; tag = ${TAG:-<none>}; prerelease = $PRERELEASE"

      # ---- Linux dependency install (apt) -------------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # Mirror setup.sh's install_linux_apt list. llvm-20 is the
          # baseline; lld-20-dev may not ship on 24.04 ARM yet, so
          # leave it best-effort.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            clang-20 \
            llvm-20-dev \
            libllvm20 \
            libantlr4-runtime-dev \
            openjdk-17-jre \
            libgtest-dev \
            libgoogle-glog-dev \
            libzstd-dev \
            vim-common \
            libxxhash-dev \
            libssl-dev
          sudo apt-get install -y lld-20-dev || \
            echo "::warning::lld-20-dev unavailable on this runner; --emit=exe will fall back to system linker"

      # ---- macOS dependency install (brew) ------------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Homebrew on macOS-13 (Intel) is at /usr/local; on macos-14
          # (Apple Silicon) it's at /opt/homebrew. `brew --prefix`
          # abstracts that for us.
          brew update
          brew install \
            cmake \
            ninja \
            llvm@20 \
            antlr4-cpp-runtime \
            openjdk@17 \
            googletest \
            glog \
            zstd \
            xxhash
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          # Apple's system clang doesn't know about llvm@20 headers/libs
          # unless we point CMake at the brew prefix explicitly.
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm@20)" >> "$GITHUB_ENV"

      # ---- Windows dependency install (choco + vcpkg) -------------------
      #
      # Windows is the most fragile leg of the matrix. Two known wrinkles
      # the first release run is likely to hit:
      #   1. ANTLR4 runtime isn't on chocolatey; the workflow installs
      #      it via vcpkg. vcpkg pulls + builds antlr4-cpp-runtime from
      #      source the first time, which can take 5+ minutes.
      #   2. The cajeta CMake script may need a vcpkg toolchain file
      #      pointer (`-DCMAKE_TOOLCHAIN_FILE=...`) to actually pick up
      #      the vcpkg-installed packages — added below.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=20.1.0 -y
          choco install ninja -y
          choco install temurin17 -y
          # vcpkg is preinstalled on windows-latest at C:\vcpkg. Install
          # every dep find_package() needs in src/CMakeLists.txt:
          #   - antlr4 (parser runtime)
          #   - zstd, xxhash (archive compression + hashing)
          #   - gtest (test framework)
          #   - glog 0.6.0 (logging — REQUIRED)
          #   - openssl (libcrypto for `cajeta archive sign / verify-sig`)
          vcpkg install `
            antlr4:x64-windows `
            zstd:x64-windows `
            xxhash:x64-windows `
            gtest:x64-windows `
            glog:x64-windows `
            openssl:x64-windows
          # Expose vcpkg's toolchain file to the build step.
          echo "VCPKG_TOOLCHAIN=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      # MSVC environment. Without this, cmake auto-discovers C:/mingw64/bin/cc.exe
      # (MinGW GCC ships preinstalled on windows-latest), and the vcpkg packages
      # — built for the x64-windows MSVC ABI — fail to link against MinGW output.
      # ilammy/msvc-dev-cmd@v1 sources vcvars64.bat into the environment for the
      # rest of the job so cmake picks up cl.exe / link.exe.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---- Configure + build --------------------------------------------
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          # setup.sh derives LLVM_DIR from CAJETA_LLVM_VERSION; we just
          # let CMake auto-detect via PATH for now, with the LLVM_DIR
          # hint set above on macOS.
          export CAJETA_SKIP_DEPS=1
          ./setup.sh

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          # CC / CXX explicitly set to MSVC's cl.exe — without this, cmake
          # may still find C:/mingw64/bin/cc.exe ahead of cl.exe on PATH
          # even after the msvc-dev-cmd action ran. Forcing it here keeps
          # the compiler choice unambiguous.
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_TOOLCHAIN" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release -- -j 4

      # ---- Smoke test: cajeta --version must succeed --------------------
      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/src/cajeta --version
          ./build/src/cajeta --version --verbose

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          ./build/src/Release/cajeta.exe --version
          ./build/src/Release/cajeta.exe --version --verbose

      # ---- Run the full regression suite --------------------------------
      #
      # The regression suite is a HARD GATE on the primary platform
      # (x86_64-linux-gnu) only. On every other target it runs but
      # failures are non-fatal (`continue-on-error: true`) — the
      # binary itself shipped by --emit=obj works fine, but JIT-driven
      # tests can hit platform-specific lowering issues (e.g.
      # __aarch64_outline_atomics_* helpers on ARM Linux LLJIT, ucontext
      # quirks on macOS) that don't affect AOT releases. Known issues
      # like that are tracked separately; gating the release on them
      # would be too tight a contract for v0.x.
      - name: Run regression (Linux / macOS)
        if: runner.os != 'Windows'
        continue-on-error: ${{ matrix.target != 'x86_64-linux-gnu' }}
        run: |
          CAJETA_SOURCE_ROOT=$PWD ./build/test/cajeta_test

      - name: Run regression (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          CAJETA_SOURCE_ROOT: ${{ github.workspace }}
        run: ./build/test/Release/cajeta_test.exe

      # ---- Package ------------------------------------------------------
      - name: Stage release contents
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.ref_version }}"
          T="${{ matrix.target }}"
          STAGE="cajeta-v${V}-${T}"
          mkdir -p "$STAGE/bin" "$STAGE"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/src/Release/cajeta.exe "$STAGE/bin/"
          else
            cp build/src/cajeta "$STAGE/bin/"
          fi
          cp VERSION README.md "$STAGE/"
          [ -f LICENSE ] && cp LICENSE "$STAGE/" || true
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"
        shell: bash

      - name: Archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
        shell: bash

      - name: Archive (zip)
        if: matrix.archive_ext == 'zip'
        run: Compress-Archive -Path "$env:STAGE_DIR" -DestinationPath "$env:STAGE_DIR.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-${{ matrix.target }}
          path: |
            cajeta-v${{ steps.version.outputs.ref_version }}-${{ matrix.target }}.tar.gz
            cajeta-v${{ steps.version.outputs.ref_version }}-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # `if: always()` so partial-matrix successes still publish what was
    # built. Use `needs.build.result != 'cancelled'` to suppress publish
    # on a user-initiated cancel.
    if: always() && needs.build.result != 'cancelled'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-derive release params
        id: params
        shell: bash
        run: |
          set -euo pipefail
          # Same derivation as the build job's `Read VERSION` step.
          # Re-doing it here (rather than passing job outputs) keeps each
          # job's logic self-contained and avoids matrix→single-job
          # output forwarding awkwardness.
          if [ -f VERSION ]; then
            V=$(cat VERSION | tr -d '[:space:]')
          else
            V="0.0.0-untagged"
          fi
          MODE="${{ github.event_name == 'push' && 'production' || inputs.mode }}"
          if [ "$MODE" = "production" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$V"
            fi
            PRERELEASE=false
            REL_NAME="cajeta $TAG"
          elif [ "$MODE" = "staging" ]; then
            TAG="staging-$V-${{ github.run_number }}"
            PRERELEASE=true
            REL_NAME="cajeta staging $V (run ${{ github.run_number }})"
          else
            TAG=""
            PRERELEASE=false
            REL_NAME=""
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=$REL_NAME" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show staged artifacts
        run: ls -laR artifacts

      - name: Create / update GitHub Release
        # Skip on dry-run: artifacts uploaded by the build job stay
        # available as Actions artifacts (downloadable from the workflow
        # run page, 90-day default expiry), but no public Release or
        # git tag is created. That's the whole point of dry-run mode.
        if: steps.params.outputs.mode != 'dry-run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag }}
          name: ${{ steps.params.outputs.release_name }}
          prerelease: ${{ steps.params.outputs.prerelease }}
          # `make_latest` defaults to true only for non-prereleases on
          # a v* tag pattern; staging Releases stay off the "latest"
          # marker automatically. Explicit for the production path.
          make_latest: ${{ steps.params.outputs.prerelease == 'false' && 'true' || 'false' }}
          body: |
            Automated release of cajeta `${{ steps.params.outputs.tag }}`.

            ${{ steps.params.outputs.mode == 'staging' && '**This is a staging pre-release.** Not promoted to "latest"; binaries here may have known issues and are intended for testing the release process or for early-access verification.' || '' }}

            See `RELEASING.md` for the supported binary targets and
            artifact shape. Pre-1.0 versions are subject to non-backward-
            compatible changes between minor releases.
          fail_on_unmatched_files: false
          # Glob catches both `cajeta-v0.1.0-<triple>` (production) and
          # `cajeta-v0.1.0-staging-<run>-<triple>` (staging) shapes.
          files: |
            artifacts/**/cajeta-v*.tar.gz
            artifacts/**/cajeta-v*.zip

      - name: Dry-run summary
        if: steps.params.outputs.mode == 'dry-run'
        run: |
          echo "::notice::Dry-run complete. No Release created, no git tag pushed."
          echo "::notice::Artifacts uploaded as workflow artifacts only — download from the run page (90-day expiry)."
