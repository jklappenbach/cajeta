# Release workflow. Triggered when a tag matching v* lands on origin.
# Cross-builds the cajeta compiler for every supported target, then
# attaches the artifacts to the matching GitHub Release. The full flow
# and supported targets are documented in RELEASING.md.
#
# Non-trivial parts called out in inline comments:
#   - macOS jobs install LLVM via Homebrew and pass LLVM_DIR explicitly
#     to CMake (brew doesn't put LLVM on the default search path).
#   - Windows uses Chocolatey for LLVM 22 + vcpkg for ANTLR4 runtime
#     (apt-style "everything in one place" isn't available there).
#   - The build matrix is `fail-fast: false` so a flaky transient on
#     one target doesn't take down the whole release.
#   - RISC-V is not yet wired — cross-compilation needs a riscv64
#     sysroot with LLVM + ANTLR4 + zstd already provisioned. Tracked
#     in RELEASING.md as best-effort / future.

name: release

# Three ways to trigger:
#
#   1. Push a `v*` tag — full production release. Primary path.
#      `git tag v0.1.1 && git push origin v0.1.1`
#      Pre-releases use semver tags: `v0.2.0-rc1`, `v0.2.0-beta1` etc.
#      land as GitHub pre-releases automatically (recognized by the
#      `-` suffix per semver).
#
#   2. Actions UI → "release" → "Run workflow", mode = dry-run.
#      Builds + tests every target, skips the Release publish step
#      entirely. Use to verify the matrix works without touching
#      the public surface or creating any git tag. Default mode
#      when triggered manually.
#
#   3. Actions UI → "release" → "Run workflow", mode = production.
#      Equivalent to a `v*` tag push but triggered from the UI —
#      reads VERSION at run time, creates the tag, publishes as
#      latest. For when you don't want to do the local tag dance
#      (e.g. cutting a release from the GitHub mobile app).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'dry-run'
        options:
          - dry-run
          - production

permissions:
  contents: write   # needed for softprops/action-gh-release to create / update the Release

# The research/ PDFs live in Git LFS, but no build/test/release job needs
# them. Skip the LFS smudge filter on checkout so the ~900 MB of PDFs are
# never downloaded here — the pointers stay as small text files and don't
# count against the repo's LFS bandwidth on every CI run.
env:
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  # Build the IntelliJ IDEA plugin once (plan §7). Its distribution zip is
  # downloaded by every compiler build job and embedded into the binary
  # (xxd -i in src/CMakeLists.txt) so `cajeta ide install` works from any
  # distribution form. Built before the matrix via `needs: plugin`.
  plugin:
    name: build IDE plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync plugin version to VERSION (D9)
        run: |
          set -euo pipefail
          V=$(cat VERSION | tr -d '[:space:]')
          echo "PLUGIN_VERSION=$V" >> "$GITHUB_ENV"
          echo "::notice::IDE plugin version = $V"

      - name: Build plugin
        working-directory: ide-plugins/idea
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon -PpluginVersion="${PLUGIN_VERSION}" buildPlugin

      # NOTE: `verifyPlugin` was removed from the release path. The JetBrains
      # plugin verifier spins up a full headless IDEA and downloads multiple
      # IDE distributions; in CI it hung/exhausted the runner, and a lost
      # runner fails the job even with continue-on-error — which then skips the
      # whole compiler matrix (needs: plugin) and reds the release. It's a
      # non-gating compatibility check with no release-blocking value, so it
      # belongs in a dedicated PR/CI workflow, not here. (Installer plan §7:
      # "tighten into a hard gate once proven stable" — it proved unstable.)

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-plugin
          path: ide-plugins/idea/build/distributions/*.zip
          if-no-files-found: warn

      # Sign + publish to the JetBrains Marketplace (plan §8 / D10). Production
      # only — never on dry-run — and pre-release tags (v*-rc1, v*-beta1) are
      # skipped so they don't land on the stable channel. No-op (warning, not
      # failure) until the signing cert / PUBLISH_TOKEN secrets are configured
      # AND the one-time manual first upload has been done on the Marketplace.
      - name: Publish plugin to JetBrains Marketplace
        if: github.event_name == 'push' || inputs.mode == 'production'
        working-directory: ide-plugins/idea
        continue-on-error: true
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          # Skip pre-release tags (don't ship rc/beta to the stable channel).
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${GITHUB_REF_NAME}" in
              *-*) echo "::notice::pre-release tag ${GITHUB_REF_NAME}; skipping Marketplace publish"; exit 0 ;;
            esac
          fi
          if [ -z "${PUBLISH_TOKEN:-}" ] || [ -z "${CERTIFICATE_CHAIN:-}" ]; then
            echo "::warning::Marketplace secrets (PUBLISH_TOKEN / signing cert) not set; skipping signPlugin + publishPlugin"
            exit 0
          fi
          # publishPlugin depends on signPlugin; run both explicitly for clarity.
          ./gradlew --no-daemon -PpluginVersion="${PLUGIN_VERSION}" signPlugin publishPlugin

  build:
    name: build (${{ matrix.target }})
    needs: plugin
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            archive_ext: tar.gz
            shell: bash
          - os: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            archive_ext: tar.gz
            shell: bash
          # x86_64-apple-darwin removed from the matrix: GitHub-hosted
          # macos-13 (Intel) runners are scarce + slow to dispatch
          # (Apple stopped selling Intel Macs in 2022; runner pool is
          # being wound down). Intel Mac users build from source —
          # documented in RELEASING.md.
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            shell: bash
          # Windows build uses MSYS2 / MinGW-w64 rather than MSVC.
          # MSYS2's pacman repo ships pre-built mingw-w64 packages for
          # LLVM, antlr4-runtime, etc. — no LLVM tarball download, no
          # vcpkg-from-source builds, no MSVC env setup, no diaguids
          # patching. The POSIX-ish surface (pthread via winpthreads,
          # ucontext via libucontext) means cajeta_runtime.c compiles
          # with minimal conditionals vs the heavy MSVC shim that would
          # otherwise be needed. Resulting binary is native PE (no
          # cygwin1.dll runtime dependency); target triple is
          # x86_64-w64-mingw32.
          - os: windows-latest
            target: x86_64-w64-mingw32
            archive_ext: zip
            shell: 'msys2 {0}'

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Fetch the full history so CMake's git rev-parse can stamp the
          # short hash into the binary. Shallow clones produce a "unknown"
          # hash, which is allowed but defeats the point.
          fetch-depth: 0

      - name: Read VERSION + derive release mode/tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -f VERSION ]; then
            V=$(cat VERSION | tr -d '[:space:]')
          else
            V="0.0.0-untagged"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

          # MODE: production on tag push, otherwise the workflow_dispatch
          # input (dry-run or production). Pre-releases are handled via
          # semver tags (`v0.2.0-rc1`) — softprops/action-gh-release auto-
          # detects the `-` suffix and marks them prerelease.
          MODE="${{ github.event_name == 'push' && 'production' || inputs.mode }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "production" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              # Tag push — ref version is authoritative.
              REF_TAG="${GITHUB_REF_NAME#v}"
              TAG="${GITHUB_REF_NAME}"
            else
              # Manual production trigger — derive from VERSION.
              REF_TAG="$V"
              TAG="v$V"
            fi
            REL_NAME="cajeta $TAG"
          else
            # Dry-run: still compute an artifact name so the upload step
            # works, but the release-publish job will short-circuit.
            REF_TAG="$V-dryrun-${{ github.run_number }}"
            TAG=""
            REL_NAME=""
          fi

          echo "ref_version=$REF_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$REL_NAME" >> "$GITHUB_OUTPUT"

          echo "::notice::release mode = $MODE; tag = ${TAG:-<none>}"

      # ---- Linux dependency install (apt) -------------------------------
      # Non-LLVM deps — always installed on every Linux leg.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # Mirror setup.sh's install_linux_apt list, MINUS LLVM (provisioned
          # separately below: the fork toolchain on x86_64-linux-gnu, distro
          # LLVM 22 on the other legs).
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            libantlr4-runtime-dev \
            openjdk-21-jre \
            libgtest-dev \
            libgoogle-glog-dev \
            libzstd-dev \
            vim-common \
            libxxhash-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            rpm \
            file

      # x86_64-linux-gnu consumes the prebuilt fork toolchain (LLVM 23 + clang +
      # lld) carrying the SPV_KHR_ray_query patches — see plans/c0/. This is the
      # ONLY toolchain that can lower ray query; distro LLVM 22 cannot (and cajeta
      # now references fork-only intrinsic enums, so it wouldn't even build against
      # 22). Other Linux legs fall through to distro LLVM until their fork artifact
      # is built (expand the gate as fork-build-llvm.yml adds host legs).
      - name: Fetch prebuilt LLVM toolchain (from the cajeta-spirv fork)
        # Legs that link the fork toolchain (carrying the SPIR-V ray-query +
        # Tier-1 intrinsic patches). Windows is here because cajeta's Tier-1 SPIR-V
        # codegen now references fork-only intrinsic enums that stock MSYS2 LLVM 22
        # lacks — so the Windows release MUST link the fork (no distro fallback).
        if: >-
          (runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu') ||
          (runner.os == 'Windows' && matrix.target == 'x86_64-w64-mingw32')
        env:
          # Bump when re-cutting the toolchain (new pinned base or new SPIR-V
          # patches). r3 is the first release containing the ray-query lowering;
          # the windows-x64 asset must be published under whatever tag this names
          # (re-run fork-build-llvm.yml's build-windows job for this tag, or bump).
          LLVM_RELEASE_TAG: cajeta-llvm-23-r3
        run: |
          set -euo pipefail
          # The fork names assets by host (asset_os), NOT by cajeta's target triple:
          # x86_64-linux-gnu -> linux-x64, aarch64-linux-gnu -> linux-arm64,
          # x86_64-w64-mingw32 -> windows-x64 (see fork-build-llvm.yml). Map first.
          case "${{ matrix.target }}" in
            x86_64-linux-gnu)   ASSET_OS=linux-x64 ;;
            aarch64-linux-gnu)  ASSET_OS=linux-arm64 ;;
            x86_64-w64-mingw32) ASSET_OS=windows-x64 ;;
            *) echo "::error::no fork asset_os mapping for ${{ matrix.target }}"; exit 1 ;;
          esac
          ASSET="${LLVM_RELEASE_TAG}-${ASSET_OS}.tar.zst"
          URL="https://github.com/jklappenbach/cajeta-llvm/releases/download/${LLVM_RELEASE_TAG}/${ASSET}"
          mkdir -p "$HOME/cajeta-llvm"
          curl -fsSL "$URL" -o /tmp/llvm.tar.zst
          tar --zstd -xf /tmp/llvm.tar.zst -C "$HOME/cajeta-llvm" --strip-components=1
          echo "LLVM_DIR=$HOME/cajeta-llvm/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$HOME/cajeta-llvm/bin" >> "$GITHUB_PATH"

      # Legs without a fork artifact yet: distro LLVM 22 from apt.llvm.org. (These
      # legs cannot lower ray query — release-only until their fork artifact lands.)
      - name: Install distro LLVM 22 (Linux legs without a fork artifact)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-linux-gnu'
        run: |
          set -euo pipefail
          # LLVM 22 isn't in Ubuntu's stock repos yet, so add the official
          # apt.llvm.org source for this release's codename (serves amd64+arm64).
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-22 \
            llvm-22-dev \
            libllvm22
          sudo apt-get install -y lld-22-dev || \
            echo "::warning::lld-22-dev unavailable on this runner; --emit=exe will fall back to system linker"

      # ---- macOS dependency install (brew) ------------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Homebrew on macOS-13 (Intel) is at /usr/local; on macos-14
          # (Apple Silicon) it's at /opt/homebrew. `brew --prefix`
          # abstracts that for us.
          brew update
          # Homebrew has no versioned llvm@22 formula; the unversioned `llvm`
          # is currently 22.x. The compiler only needs the LLVM >= 21 API
          # (the Triple-based lookupTarget / createTargetMachine), so tracking
          # `llvm` is fine -- LLVM_DIR below pins CMake to whatever it resolves.
          brew install \
            cmake \
            ninja \
            llvm \
            antlr4-cpp-runtime \
            openjdk@21 \
            googletest \
            glog \
            zstd \
            xxhash
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"
          # Apple's system clang doesn't know about the brew llvm headers/libs
          # unless we point CMake at the brew prefix explicitly.
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      # ---- Windows: MSYS2 / MinGW-w64 ----------------------------------
      #
      # MSYS2's mingw-w64 environment provides a near-POSIX surface on
      # Windows (winpthreads, libucontext, etc.) so the Unix-style cajeta
      # runtime compiles with minimal conditionals. All deps land via
      # pacman — no LLVM tarball, no vcpkg-from-source, no MSVC env, no
      # diaguids hack. Produces a native PE binary (no cygwin1.dll
      # runtime dependency); the toolchain triple is x86_64-w64-mingw32.
      #
      # Java is installed via actions/setup-java rather than pacman —
      # MSYS2's Java packaging is inconsistent (both mingw-w64-x86_64-jre
      # and mingw-w64-x86_64-jdk-openjdk don't exist). setup-java works
      # reliably across all platforms and adds java to PATH so MSYS2's
      # bash inherits it.
      - name: Setup Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit  # inherit Windows PATH so `java` from setup-java is visible
          # NO mingw llvm/lld/clang here: this leg links the cajeta-llvm FORK
          # (fetched below), and a second stock LLVM 22 on PATH/in the lib search
          # dirs would mis-resolve at link (the runbook's "two LLVMs" trap — cajeta
          # links lldELF/lldCommon + libLLVM*, which must ALL be the fork's v23).
          # cajeta's C++ is compiled by mingw `c++` (g++), so install gcc explicitly
          # (previously pulled transitively by the clang package). The runtime-bitcode
          # `clang` and in-process `lld` both come from the fork tree on PATH.
          # vulkan-headers: <vulkan/vulkan.h> for the runtime's Vulkan compute
          # path (the loader vulkan-1.dll is dlopen'd at run time, no link dep).
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-antlr4-runtime-cpp
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-xxhash
            mingw-w64-x86_64-glog
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-vulkan-headers
            vim

      # ---- Fetch the prebuilt IDE plugin for embedding ------------------
      # The `plugin` job built Cajeta's IDEA plugin once; drop its zip where
      # src/CMakeLists.txt's embed glob looks (ide-plugins/idea/build/
      # distributions/*.zip) so the Configure step below bakes it into the
      # binary. Non-fatal: if it's missing, the embed falls back to a stub and
      # `cajeta ide install` reports no bundled plugin (the compiler still ships).
      - name: Download IDE plugin (for embedding)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cajeta-plugin
          path: ide-plugins/idea/build/distributions

      # ---- Configure + build (all platforms) ----------------------------
      # setup.sh's dep-install logic is gated by CAJETA_SKIP_DEPS=1 here
      # because the dependency install already happened above per-platform.
      # The cmake configure that setup.sh runs is portable across all
      # three host paths (apt Linux, brew macOS, MSYS2 mingw-w64-cmake).
      - name: Configure
        run: |
          set -euo pipefail
          export CAJETA_SKIP_DEPS=1
          # Windows links the cajeta-llvm fork (fetched above). Build cajeta's C++
          # with mingw g++, NOT the fork's clang++ — the fork bin is first on PATH,
          # so CMake would auto-pick clang++, which on mingw doesn't auto-link
          # winpthreads and fails the LLVM/libstdc++ pthread_* symbols at link. The
          # fork still supplies the LLVM libs/headers + clang for the bitcode step.
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CC=gcc CXX=g++
          fi
          ./setup.sh

      - name: Build
        run: cmake --build build --config Release -- -j 4

      # ---- Smoke test: cajeta --version must succeed --------------------
      - name: Smoke test
        run: |
          ./build/src/cajeta --version
          ./build/src/cajeta --version --verbose

      # ---- Run the release regression subset ----------------------------
      #
      # NOT the full ~1725-test battery — running that on all four matrix
      # targets is too expensive, and most of it is the host-independent
      # front-end (parser/typer/borrow-checker), which can't regress due to
      # cross-compilation. release_tests.sh runs only the curated subset in
      # test/release_filter.txt: the back-end/runtime areas that lower
      # differently per ISA/OS/endianness/ABI (numeric intrinsics, byte
      # serialization + .cja archive format, struct/view layout, atomics,
      # TLS + drop chain, async/fibers, threading, OS/file I/O) plus a thin
      # codegen/dispatch smoke. NO_BUILD=1 — the Build step above already
      # built the tree; the script just runs against it (sharded).
      #
      # HARD GATE on the primary platform (x86_64-linux-gnu) only. On every
      # other target it runs but failures are non-fatal
      # (`continue-on-error: true`) — the binary shipped by --emit=obj works
      # fine, but JIT-driven tests can hit platform-specific lowering issues
      # (e.g. __aarch64_outline_atomics_* helpers on ARM Linux LLJIT,
      # __emutls_get_address on macOS arm64) that don't affect AOT releases.
      # Known issues are tracked separately; gating the release on them would
      # be too tight a contract for v0.x.
      - name: Run release tests
        continue-on-error: ${{ matrix.target != 'x86_64-linux-gnu' }}
        run: NO_BUILD=1 ./release_tests.sh

      # ---- Provision the installer toolchain ----------------------------
      # WiX Toolset for the Windows MSI. Pinned to v5: v6/v7 require accepting
      # the Open Source Maintenance Fee (OSMF) EULA. CPack's WIX generator uses
      # the modern `wix` CLI (CPACK_WIX_VERSION >= 4, set in CPackOptions.cmake).
      # dotnet is preinstalled on windows-latest; the UI extension is needed by
      # the CPack-generated authoring. Append the tools dir to PATH for later
      # steps (msys2 inherits the Windows PATH, so the bash cpack step sees wix).
      - name: Provision WiX (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # ---- Build native installers (CPack) ------------------------------
      # Wraps the CMake install() tree (top-level CMakeLists.txt §3) into the
      # platform-native format(s). Linux: .deb + .rpm (both arches via the
      # respective runners); Windows: .msi; macOS: .pkg (productbuild). The
      # generic .tar.gz/.zip is still hand-staged below as the Tier-0 artifact.
      # Runs in every mode (incl. dry-run) — the release-publish job is what
      # gates on mode, so dry-run still produces + uploads installers.
      #
      # NOTE: the Linux .deb/.rpm dependency lists are only fully correct once
      # the D2 Linux static-link lands (plan §3/§1); until then they may declare
      # libLLVM. The package *shape* is produced and uploaded regardless.
      - name: Build native installers
        id: installers
        # Non-fatal for now: the installer formats aren't validated end-to-end
        # yet (D2 Linux static-link + §4 clean-container install-test + §6 macOS
        # path/signing are still open). Producing them must NOT red the existing
        # tarball release. Flip to a hard gate per-target as each is validated.
        continue-on-error: true
        run: |
          set -euo pipefail
          cd build
          case "${{ runner.os }}" in
            Linux)
              cpack -G DEB
              cpack -G RPM
              ;;
            macOS)
              cpack -G productbuild
              ;;
            Windows)
              cpack -G WIX
              ;;
          esac
          echo "Produced installers:"
          ls -la *.deb *.rpm *.msi *.pkg 2>/dev/null || true

      # ---- Package ------------------------------------------------------
      # MSYS2 ships bash + tar + zip, so the staging and archive logic
      # is uniform across all three platforms. cajeta the binary lands
      # at build/src/cajeta on Linux/macOS and build/src/cajeta.exe
      # under MSYS2 (mingw32-make / ninja produce .exe automatically).
      - name: Stage release contents
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.ref_version }}"
          T="${{ matrix.target }}"
          STAGE="cajeta-v${V}-${T}"
          mkdir -p "$STAGE/bin" "$STAGE"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/src/cajeta.exe "$STAGE/bin/"
          else
            cp build/src/cajeta "$STAGE/bin/"
          fi
          cp VERSION README.md "$STAGE/"
          [ -f LICENSE ] && cp LICENSE "$STAGE/" || true
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"

      # ---- cvm download asset (D12) ------------------------------------
      # cvm installs the BARE binary — it writes the downloaded bytes
      # straight to ~/.cajeta/versions/<ver>/cajeta and chmod +x, with no
      # tar/zip extractor. So publish the raw executable per target (named
      # by triple) plus its SHA-256 in a small `<triple>.cvmmeta` metadata
      # file that the release job folds into index.json (the cvm manifest).
      - name: Stage cvm download asset + checksum
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.ref_version }}"
          T="${{ matrix.target }}"
          mkdir -p cvm-dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=build/src/cajeta.exe
            ASSET="cajeta-v${V}-${T}.exe"
          else
            BIN=build/src/cajeta
            ASSET="cajeta-v${V}-${T}"
          fi
          cp "$BIN" "cvm-dist/${ASSET}"
          if command -v sha256sum >/dev/null 2>&1; then
            SHA=$(sha256sum "cvm-dist/${ASSET}" | cut -d' ' -f1)
          else
            SHA=$(shasum -a 256 "cvm-dist/${ASSET}" | cut -d' ' -f1)
          fi
          printf '%s\t%s\t%s\n' "$T" "$ASSET" "$SHA" > "cvm-dist/${T}.cvmmeta"
          echo "cvm asset: ${ASSET}  sha256=${SHA}"

      - name: Archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"

      - name: Archive (zip)
        if: matrix.archive_ext == 'zip'
        run: |
          # MSYS2 ships `zip` via the zip package — but it's not in
          # the install list above. Use a more universal alternative:
          # python -c '...' to make a deterministic zip. python is
          # available in MSYS2's MINGW64 by default.
          python -c "import shutil; shutil.make_archive(r'${STAGE_DIR}', 'zip', '.', r'${STAGE_DIR}')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-${{ matrix.target }}
          path: |
            cajeta-v${{ steps.version.outputs.ref_version }}-${{ matrix.target }}.tar.gz
            cajeta-v${{ steps.version.outputs.ref_version }}-${{ matrix.target }}.zip
            cvm-dist/*
            build/*.deb
            build/*.rpm
            build/*.msi
            build/*.pkg
            build/*.sha256
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # `if: always()` so partial-matrix successes still publish what was
    # built. Use `needs.build.result != 'cancelled'` to suppress publish
    # on a user-initiated cancel.
    if: always() && needs.build.result != 'cancelled'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-derive release params
        id: params
        shell: bash
        run: |
          set -euo pipefail
          # Same derivation as the build job's `Read VERSION` step.
          # Re-doing it here (rather than passing job outputs) keeps each
          # job's logic self-contained and avoids matrix→single-job
          # output forwarding awkwardness.
          if [ -f VERSION ]; then
            V=$(cat VERSION | tr -d '[:space:]')
          else
            V="0.0.0-untagged"
          fi
          MODE="${{ github.event_name == 'push' && 'production' || inputs.mode }}"
          if [ "$MODE" = "production" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$V"
            fi
            REL_NAME="cajeta $TAG"
          else
            TAG=""
            REL_NAME=""
          fi
          # ref_version mirrors the build job: the version without a leading
          # 'v', used in the cvm asset filenames + the manifest `version`.
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF_NAME#v}"
          else
            REF="$V"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref_version=$REF" >> "$GITHUB_OUTPUT"
          echo "release_name=$REL_NAME" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show staged artifacts
        run: ls -laR artifacts

      # ---- cvm manifest (index.json) -----------------------------------
      # Fold every build job's `<triple>.cvmmeta` (triple, asset filename,
      # sha256) into one self-describing per-release manifest cvm fetches
      # via the stable `releases/{latest,download/<tag>}/download/index.json`
      # URL. Also collects the raw per-triple binaries cvm downloads. The
      # manifest + binaries upload only on production (the release step is
      # gated on mode), but assembling always lets dry-run inspect it.
      - name: Assemble cvm manifest (index.json)
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.params.outputs.ref_version }}"
          TAG="${{ steps.params.outputs.tag }}"
          # Dry-run has no tag; use the would-be tag so URLs are well-formed.
          [ -n "$TAG" ] || TAG="v${V}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          mkdir -p release-assets
          ASSETS=""
          while IFS=$'\t' read -r T ASSET SHA; do
            [ -n "$T" ] || continue
            ENTRY="\"${T}\": { \"url\": \"${BASE}/${ASSET}\", \"sha256\": \"${SHA}\" }"
            if [ -z "$ASSETS" ]; then ASSETS="$ENTRY"; else ASSETS="${ASSETS}, ${ENTRY}"; fi
          done < <(cat artifacts/**/*.cvmmeta 2>/dev/null | sort)
          if [ -z "$ASSETS" ]; then
            echo "::warning::no .cvmmeta files found — skipping cvm manifest"
            exit 0
          fi
          printf '{ "schemaVersion": 1, "version": "%s", "assets": { %s } }\n' \
            "$V" "$ASSETS" > release-assets/index.json
          echo "=== index.json ==="; cat release-assets/index.json
          # The bare binaries cvm downloads (raw exe per triple — not the
          # tarballs/zips, which cvm can't extract).
          find artifacts -type f -name 'cajeta-v*' \
            ! -name '*.tar.gz' ! -name '*.zip' -exec cp {} release-assets/ \;
          echo "=== release-assets ==="; ls -la release-assets

      - name: Create / update GitHub Release
        # Skip on dry-run: artifacts uploaded by the build job stay
        # available as Actions artifacts (downloadable from the workflow
        # run page, 90-day default expiry), but no public Release or
        # git tag is created. That's the whole point of dry-run mode.
        #
        # Pre-releases: softprops/action-gh-release auto-detects from
        # the tag's semver — `v0.2.0-rc1` and similar suffixed tags
        # land as pre-releases automatically, regular `v0.2.0` tags
        # land as "latest". No explicit prerelease flag needed.
        if: steps.params.outputs.mode != 'dry-run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag }}
          name: ${{ steps.params.outputs.release_name }}
          body: |
            Automated release of cajeta `${{ steps.params.outputs.tag }}`.

            See `RELEASING.md` for the supported binary targets and
            artifact shape. Pre-1.0 versions are subject to non-backward-
            compatible changes between minor releases.
          fail_on_unmatched_files: false
          files: |
            artifacts/**/cajeta-v*.tar.gz
            artifacts/**/cajeta-v*.zip
            artifacts/**/cajeta-idea-*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.pkg
            artifacts/**/*.sha256
            release-assets/index.json
            release-assets/cajeta-v*

      - name: Dry-run summary
        if: steps.params.outputs.mode == 'dry-run'
        run: |
          echo "::notice::Dry-run complete. No Release created, no git tag pushed."
          echo "::notice::Artifacts uploaded as workflow artifacts only — download from the run page (90-day expiry)."
