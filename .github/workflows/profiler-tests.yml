# cajeta-profiler's runner lanes on the NVIDIA box (plan Unit 12, spec §5.4,
# §6.2, §6.8, §12.3, §12.5).
#
# Unit 12 targets PHOENIX (Windows/RTX 4090) and phoenix-wsl — there is no
# NVIDIA hardware on the development machine, so these lanes ARE where the
# CUPTI backend gets built and where 12.3.a's "green on PHOENIX and
# phoenix-wsl" is answered. They exist before the ProfilerCupti* suites do,
# deliberately: the Profiler* corpus (sampler, seam, capture, clock,
# integrity, trace wire — 160+ tests) has NEVER run on Windows or against the
# NVIDIA stack, and §6.8's Windows host-clock path plus §12.5's WSL
# timestamp-callback hazard both need a measured baseline before Unit 12
# asserts anything against them. New ProfilerCupti*/ProfilerNvidia* suites
# match the default filter as they land — no workflow change needed.
#
# dispatch-only, no cron: Unit 12 is in flight, and a nightly that is red
# because the unit is unfinished is a nightly people learn to ignore. Add the
# schedule when 12.3.a closes.
#
# Build recipe is device-tests.yml's, which is release.yml's — including the
# self-hosted quirks those files already paid for (MSYS2's read-only $HOME on
# PHOENIX, the fork's stale LLVMConfig tools dir, the NOTFOUND-caching
# workspace reuse). Keep the three in sync when the recipe changes.
name: profiler-tests

on:
  workflow_dispatch:
    inputs:
      legs:
        description: 'Which runners to use'
        required: true
        type: choice
        options: [both, wsl, windows, lavapipe, all]
        default: both
      filter:
        description: 'gtest filter (blank = per-leg default)'
        required: false
        default: ''

concurrency:
  # The runners are single-box; newest wins.
  group: profiler-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          WSL='{"name":"wsl-nvidia","key":"wsl","os":["self-hosted","wsl"],"asset_os":"linux-x64","shell":"bash"}'
          WIN='{"name":"windows-nvidia","key":"windows","os":["self-hosted","Windows","X64","gpu"],"asset_os":"windows-x64","shell":"msys2 {0}"}'
          # The lavapipe leg is HOSTED, not self-hosted, and deliberately so:
          # plan 13.3.b wants the Vulkan plumbing exercised somewhere with no
          # vendor driver at all, and neither NVIDIA box ships lavapipe. It
          # runs a narrow filter because a software rasteriser has nothing to
          # say about the rest of the corpus. Opt-in: it costs a full
          # from-source build on a hosted runner, so it is not in `both`.
          LVP='{"name":"lavapipe","key":"lavapipe","os":"ubuntu-latest","asset_os":"linux-x64","shell":"bash"}'
          LEGS='${{ inputs.legs }}'
          [ -z "$LEGS" ] && LEGS=both
          case "$LEGS" in
            wsl)      INC="[$WSL]" ;;
            windows)  INC="[$WIN]" ;;
            both)     INC="[$WSL,$WIN]" ;;
            lavapipe) INC="[$LVP]" ;;
            all)      INC="[$WSL,$WIN,$LVP]" ;;
            *) echo "::error::unknown legs value '$LEGS'"; exit 1 ;;
          esac
          echo "matrix={\"include\":$INC}" >> "$GITHUB_OUTPUT"

  profiler:
    needs: setup
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Profiler* corpus took ~10 min on proton AFTER a warm build; the
    # from-source build dominates. Same ceiling as device-tests.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-antlr4-runtime-cpp
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-xxhash
            mingw-w64-x86_64-glog
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-vulkan-headers
            tar
            vim

      # 13.3.b's whole point: a Vulkan stack with NO vendor driver. Installed
      # rather than assumed, because the test's ICD lookup skipping quietly is
      # exactly how this item sat unmet while the suite reported green.
      - name: Install lavapipe (software Vulkan)
        if: matrix.key == 'lavapipe'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # libvulkan-dev is the load-bearing one and the least obvious:
          # VulkanDriver.cpp keys CAJETA_HAS_VULKAN_HEADER off <vulkan/vulkan.h>
          # at COMPILE time. Without it the driver compiles to a stub whose
          # available() returns false forever, and every Vulkan test skips on a
          # box that has a perfectly good software device. mesa-vulkan-drivers,
          # libvulkan1 and vulkan-tools ship no headers between them.
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libvulkan-dev vulkan-tools
          echo "--- ICD manifests present ---"
          ls -1 /usr/share/vulkan/icd.d/ || true
          # Name the manifest for the test rather than letting it guess: mesa
          # names this file per-architecture and the two spellings differ
          # between Ubuntu and other distributions.
          ICD=""
          for c in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                   /usr/share/vulkan/icd.d/lvp_icd.json; do
            if [ -f "$c" ]; then ICD="$c"; break; fi
          done
          if [ -z "$ICD" ]; then
            echo "::error::mesa installed but no lavapipe ICD manifest appeared"
            ls -1 /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "CAJETA_LAVAPIPE_ICD=$ICD" >> "$GITHUB_ENV"
          # And make its absence fatal on the one leg that exists to run it.
          echo "CAJETA_REQUIRE_LAVAPIPE=1" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary 2>/dev/null |
            grep -i 'deviceName\|driverName' || echo "(vulkaninfo summary unavailable)"

      # Which stacks this box actually offers the profiler: CUPTI is what
      # Unit 12 binds, and the 4090's Vulkan driver is a third data point for
      # Unit 13's backend (proton covered RADV and lavapipe). Non-fatal — the
      # tests degrade per §10.4 and the summary shows what really ran.
      - name: GPU inventory
        continue-on-error: true
        run: |
          echo "== nvidia =="; nvidia-smi -L || echo "(no nvidia-smi)"
          echo "== cupti ==";  find /usr/local/cuda*/extras/CUPTI/lib64 /c/Program\ Files/NVIDIA\ GPU\ Computing\ Toolkit -name 'libcupti*' -o -name 'cupti*.dll' 2>/dev/null | head -3 || true
          echo "== vulkan ==";  vulkaninfo --summary 2>/dev/null | grep -i deviceName || echo "(no vulkaninfo)"

      - name: Fetch prebuilt LLVM toolchain (cajeta-spirv fork)
        env:
          # Keep in lockstep with release.yml's LLVM_RELEASE_TAG.
          LLVM_RELEASE_TAG: cajeta-llvm-23-r10
        run: |
          set -euo pipefail
          ASSET="${LLVM_RELEASE_TAG}-${{ matrix.asset_os }}.tar.zst"
          URL="https://github.com/jklappenbach/cajeta-llvm/releases/download/${LLVM_RELEASE_TAG}/${ASSET}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            DEST="$PWD/cajeta-llvm"
          else
            DEST="$HOME/cajeta-llvm"
          fi
          mkdir -p "$DEST"
          curl -fsSL "$URL" -o llvm.tar.zst
          if [ "${{ runner.os }}" = "Windows" ]; then
            zstd -dc llvm.tar.zst | tar -x -C "$DEST" --strip-components=1
            echo "LLVM_DIR=$(cygpath -m "$DEST")/lib/cmake/llvm" >> "$GITHUB_ENV"
            echo "$(cygpath -w "$DEST")\\bin" >> "$GITHUB_PATH"
          else
            tar --zstd -xf llvm.tar.zst -C "$DEST" --strip-components=1
            echo "LLVM_DIR=$DEST/lib/cmake/llvm" >> "$GITHUB_ENV"
            echo "$DEST/bin" >> "$GITHUB_PATH"
          fi
          rm -f llvm.tar.zst

      - name: Configure
        run: |
          set -euo pipefail
          # The self-hosted boxes carry antlr4/glog/gtest/zstd/xxhash already,
          # and re-resolving them there is slow and occasionally destructive.
          # A HOSTED runner carries none of them, so the lavapipe leg must let
          # setup.sh do its dependency phase or it cannot configure at all.
          if [ '${{ matrix.key }}' != 'lavapipe' ]; then
            export CAJETA_SKIP_DEPS=1
          fi
          if [ -f build/CMakeCache.txt ] && grep -q 'NOTFOUND' build/CMakeCache.txt; then
            echo "stale CMakeCache holds NOTFOUND entries — removing it to force a clean configure:"
            grep 'NOTFOUND' build/CMakeCache.txt | head -10
            rm -f build/CMakeCache.txt
            rm -rf build/CMakeFiles/CMakeError.log
          fi
          CMAKE_EXTRA=()
          FORK_ROOT="${LLVM_DIR%/lib/cmake/llvm}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CC=gcc CXX=g++
            CMAKE_EXTRA+=("-DCAJETA_CLANG=${FORK_ROOT}/bin/clang.exe")
            CMAKE_EXTRA+=("-DCAJETA_LLVM_LINK=${FORK_ROOT}/bin/llvm-link.exe")
          elif [ '${{ matrix.key }}' = 'lavapipe' ]; then
            # Two LLVM 23s live on this box and they are NOT interchangeable:
            # the fork (LLVM23.0.0git, fetched above) and apt.llvm.org's
            # 23.1.0, which setup.sh's dependency phase pulls in as clang-23 /
            # llvm-23-dev. The fork's clang emits the runtime bitcode and
            # /usr/bin/llvm-link-23 then refuses to read it:
            #   Unknown module asm property
            #   (Producer: 'LLVM23.0.0git' Reader: 'LLVM 23.1.0')
            # The self-hosted legs never hit this because they skip the
            # dependency phase and so only ever have the fork. Pin both tools
            # to the fork, exactly as the Windows leg already does.
            CMAKE_EXTRA+=("-DCAJETA_CLANG=${FORK_ROOT}/bin/clang")
            CMAKE_EXTRA+=("-DCAJETA_LLVM_LINK=${FORK_ROOT}/bin/llvm-link")
          fi
          ./setup.sh "${CMAKE_EXTRA[@]+"${CMAKE_EXTRA[@]}"}"

      - name: Build
        run: cmake --build build --config Release -- -j 4

      - name: Smoke test
        run: ./build/src/cajeta --version

      # CAJETA_SOURCE_ROOT: ProfilerRocm's one-place-tier pin slurps runtime
      # source from the tree, and a checkout on a runner is not at the default
      # root.
      - name: Run profiler tests
        env:
          CAJETA_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          FILTER='${{ inputs.filter }}'
          if [ -z "$FILTER" ]; then
            if [ '${{ matrix.key }}' = 'lavapipe' ]; then
              # A software rasteriser can speak to the Vulkan plumbing and
              # nothing else; running the whole corpus here would buy skips.
              FILTER='ProfilerVulkan*'
            else
              FILTER='Profiler*'
            fi
          fi
          echo "filter: $FILTER"
          ./build/test/cajeta_test --gtest_filter="$FILTER" 2>&1 | tee profiler-tests.log

      # Unlike the device workflow, most Profiler* tests are not hardware-
      # gated — a run where NOTHING passed means the suite is broken on this
      # platform, not that a GPU was absent. Skips still matter (they are the
      # vendor-gated lanes) so they are counted and shown.
      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          [ -f profiler-tests.log ] || { echo "::error::no test log produced"; exit 1; }
          RAN=$(grep -c '^\[       OK \]' profiler-tests.log || true)
          FAILED=$(grep -c '^\[  FAILED  \]' profiler-tests.log || true)
          SKIPPED=$(grep -c 'SKIPPED' profiler-tests.log || true)
          echo "passed: $RAN    failed-lines: $FAILED    skipped: $SKIPPED"
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| outcome | count |"
            echo "|---|---|"
            echo "| passed | $RAN |"
            echo "| skipped (vendor-gated) | $SKIPPED |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RAN" -eq 0 ]; then
            echo "::error::no profiler test passed on this leg"
            exit 1
          fi

      - name: Upload test log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: profiler-tests-${{ matrix.name }}
          path: profiler-tests.log
          if-no-files-found: warn
