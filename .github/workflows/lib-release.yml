# Reusable release workflow for a Cajeta library (.cja).
#
# A library repo calls this from its own .github/workflows/release.yml:
#
#   jobs:
#     release:
#       uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
#       secrets: inherit
#
# On a v* tag it: installs the cajeta toolchain (from the cajeta .deb release),
# runs `cajeta build` (emits build/archive/<name>-<version>.cja), publishes a
# GitHub Release with the .cja, and does a signed publish to Olla. On PRs /
# branch pushes it builds only (no release, no publish).
name: lib-release

on:
  workflow_call:
    inputs:
      cajeta-version:
        description: 'cajeta toolchain release tag to build against'
        type: string
        required: false
        default: 'v0.7.1'
    secrets:
      OLLA_TOKEN:
        required: true
      OLLA_SIGNING_KEY_PEM:
        required: true
      OLLA_SIGNING_KEY_ID:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cajeta toolchain (${{ inputs.cajeta-version }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.cajeta-version }}" \
            --repo jklappenbach/cajeta --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          # Workaround a packaging bug: the .deb's /usr/local/bin/cajeta symlink
          # targets ../lib/cajeta/cajeta (resolves to /usr/local/lib, wrong) while
          # the binary is at /usr/lib/cajeta/cajeta — so the shipped symlink dangles.
          sudo ln -sfn /usr/lib/cajeta/cajeta /usr/local/bin/cajeta
          cajeta --version || cajeta version || true

      - name: Build library .cja
        run: cajeta build

      - name: Locate artifact
        id: art
        run: |
          set -euo pipefail
          cja="$(ls build/archive/*.cja 2>/dev/null | head -1 || true)"
          if [ -z "$cja" ]; then echo "no .cja under build/archive"; ls -R build || true; exit 1; fi
          echo "cja=$cja" >> "$GITHUB_OUTPUT"
          # cajeta.json is the single source of truth for the version: it is what
          # named the .cja `cajeta build` just produced, and what dependency
          # resolution keys off. Taking the version from the TAG instead let the
          # two disagree — tag v0.1.3 over a manifest saying 0.1.2 would publish
          # the 0.1.2 archive to Olla as 0.1.3.
          #
          # Read it through the toolchain rather than parsing here: cajeta.json is
          # JSONC, so jq cannot read it and naive comment-stripping corrupts the
          # `//` inside https:// URLs.
          VERSION="$(cajeta info | awk '/^[[:space:]]*version:/{print $2; exit}')"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from cajeta.json via 'cajeta info'" >&2
            exit 1
          fi
          # On a tag run the two MUST agree. Fail loudly rather than publish an
          # archive under a version it was not built as.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$VERSION" ]; then
              echo "::error::tag v${tag_version} disagrees with cajeta.json version ${VERSION} — bump the manifest or retag" >&2
              exit 1
            fi
          fi
          echo "version from cajeta.json: $VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cja-${{ github.run_id }}
          path: ${{ steps.art.outputs.cja }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.art.outputs.cja }}

      - name: Publish to Olla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: jklappenbach/cajeta/.github/actions/olla-publish@main
        with:
          cja-path: ${{ steps.art.outputs.cja }}
          version: ${{ steps.art.outputs.version }}
          token: ${{ secrets.OLLA_TOKEN }}
          signing-key-pem: ${{ secrets.OLLA_SIGNING_KEY_PEM }}
          signing-key-id: ${{ secrets.OLLA_SIGNING_KEY_ID }}
