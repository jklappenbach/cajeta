# Reusable release workflow for a Cajeta library (.cja).
#
# A library repo calls this from its own .github/workflows/release.yml:
#
#   jobs:
#     release:
#       uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
#       secrets: inherit
#
# On a v* tag it: installs the cajeta toolchain (from the cajeta .deb release),
# runs `cajeta build` (emits build/archive/<name>-<version>.cja), publishes a
# GitHub Release with the .cja, and does a signed publish to Olla. On PRs /
# branch pushes it builds only (no release, no publish).
name: lib-release

on:
  workflow_call:
    inputs:
      cajeta-version:
        description: 'cajeta toolchain release tag to build against'
        type: string
        required: false
        # Callers SHOULD pin this themselves. The default exists only so a new
        # library builds at all, and a stale one is actively dangerous: it sat at
        # v0.7.1 long enough that cajeta-unit silently built against a toolchain
        # three minor versions old, which could parse neither its annotation
        # declarations nor its bracket array literals. Bump this with each release.
        default: 'v0.14.0'
      test-command:
        description: >
          Command running the library's test suite (e.g. `cajeta test`,
          `./run-tests.sh`). Empty means NO TESTS RUN.
        type: string
        required: false
        # Empty by default only so existing callers keep working. A library that
        # leaves it empty gets a green tag without one test having executed —
        # this workflow built and published, and never ran anything. Set it.
        default: ''
      test-timeout-minutes:
        description: 'Hard cap on the test step, so a hung server test fails instead of hanging.'
        type: string
        required: false
        default: '30'
    # NOT required: only the two tag-gated publish steps use these, and
    # `required: true` fails the call at EVALUATION time — so a repo without
    # publish credentials couldn't even build+test on a main push (cajeta-gossip
    # died exactly this way). A tag push without them still fails, correctly and
    # loudly, in the Publish to Olla step itself.
    secrets:
      OLLA_TOKEN:
        required: false
      OLLA_SIGNING_KEY_PEM:
        required: false
      OLLA_SIGNING_KEY_ID:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cajeta toolchain (${{ inputs.cajeta-version }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.cajeta-version }}" \
            --repo jklappenbach/cajeta --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          # Workaround a packaging bug: the .deb's /usr/local/bin/cajeta symlink
          # targets ../lib/cajeta/cajeta (resolves to /usr/local/lib, wrong) while
          # the binary is at /usr/lib/cajeta/cajeta — so the shipped symlink dangles.
          sudo ln -sfn /usr/lib/cajeta/cajeta /usr/local/bin/cajeta
          cajeta --version || cajeta version || true

      - name: Build library .cja
        run: cajeta build

      # Before the artifact is located, uploaded, released or published — a
      # failing suite must stop the tag, not annotate it after the fact.
      #
      # timeout-minutes matters here specifically: these suites bind loopback
      # sockets and run live servers, and a server test that never returns hangs
      # rather than fails. Without a bound that burns the job's full default
      # allowance and reports nothing useful.
      - name: Run the test suite
        if: inputs.test-command != ''
        timeout-minutes: ${{ fromJSON(inputs.test-timeout-minutes) }}
        run: ${{ inputs.test-command }}

      - name: No test suite configured
        if: inputs.test-command == ''
        run: |
          echo "::warning::this library ran NO tests — it was built and will be \
          published unverified. Pass `test-command` to lib-release.yml."

      - name: Locate artifact
        id: art
        run: |
          set -euo pipefail
          cja="$(ls build/archive/*.cja 2>/dev/null | head -1 || true)"
          if [ -z "$cja" ]; then echo "no .cja under build/archive"; ls -R build || true; exit 1; fi
          echo "cja=$cja" >> "$GITHUB_OUTPUT"
          # cajeta.json is the single source of truth for the version: it is what
          # named the .cja `cajeta build` just produced, and what dependency
          # resolution keys off. Taking the version from the TAG instead let the
          # two disagree — tag v0.1.3 over a manifest saying 0.1.2 would publish
          # the 0.1.2 archive to Olla as 0.1.3.
          #
          # Read it through the toolchain rather than parsing here: cajeta.json is
          # JSONC, so jq cannot read it and naive comment-stripping corrupts the
          # `//` inside https:// URLs.
          VERSION="$(cajeta info | awk '/^[[:space:]]*version:/{print $2; exit}')"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from cajeta.json via 'cajeta info'" >&2
            exit 1
          fi
          # On a tag run the two MUST agree. Fail loudly rather than publish an
          # archive under a version it was not built as.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$VERSION" ]; then
              echo "::error::tag v${tag_version} disagrees with cajeta.json version ${VERSION} — bump the manifest or retag" >&2
              exit 1
            fi
          fi
          echo "version from cajeta.json: $VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cja-${{ github.run_id }}
          path: ${{ steps.art.outputs.cja }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.art.outputs.cja }}

      - name: Publish to Olla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: jklappenbach/cajeta/.github/actions/olla-publish@main
        with:
          cja-path: ${{ steps.art.outputs.cja }}
          version: ${{ steps.art.outputs.version }}
          token: ${{ secrets.OLLA_TOKEN }}
          signing-key-pem: ${{ secrets.OLLA_SIGNING_KEY_PEM }}
          signing-key-id: ${{ secrets.OLLA_SIGNING_KEY_ID }}
