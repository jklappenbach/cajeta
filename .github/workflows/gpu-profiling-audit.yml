# Profiling capability audit for the cajeta profiler, on the two self-hosted
# NVIDIA runners: PHOENIX (native Windows) and phoenix-wsl (WSL2 on the SAME
# physical box). Same RTX 4090 through two OS paths, so any difference is
# attributable to the OS rather than confounded with hardware.
#
# WHY THIS EXISTS
# The GPU kernel-timing research settled every backend empirically except one
# question, which stayed an inference: whether CUDA events and CUPTI Activity
# kernel timestamps are exempt from NVIDIA's profiling permission gate
# (NVreg_RestrictProfilingToAdminUsers / RmProfilingAdminOnly). Two independent
# research passes could not find NVIDIA stating it in so many words. That single
# question decides whether our baseline CUDA timing tier works for ordinary
# unprivileged users, so it should be measured before we build on it — the AMD
# half of the research was measured and it is where every expensive surprise
# turned up (silently-zero counters, a 5.68 s clock skew, timestamps latching
# before the kernel finished).
#
# READING THE RESULT
# The probe prints `RESULT key=value` lines; the verdict is `RESULT verdict=`.
#   EXEMPTION_PROVEN                  timing worked, this process was measured
#                                     UNPRIVILEGED, and something the gate
#                                     covers was refused for privileges in it
#   INCONCLUSIVE_PROCESS_PRIVILEGED   this process holds the privilege the gate
#                                     asks for, so timing passing proves nothing
#                                     about ordinary users. Not a pass.
#   INCONCLUSIVE_GATE_NOT_ENFORCED    this process was UNPRIVILEGED and nothing
#                                     gated was refused: the gate is off here,
#                                     so timing working says nothing about a box
#                                     where it is on. Not a pass.
#   INCONCLUSIVE_NO_GATE_PROBE        no gated operation was even supported on
#                                     this device, so the gate was never tested
#   TIMING_BROKEN                     the baseline tier does not work here
#
# The gate-state steps below run FIRST precisely because the verdict cannot be
# interpreted without them.
#
# REVISED 2026-08-29, and the first two runs are why. Both returned
# INCONCLUSIVE_PROCESS_PRIVILEGED — read at the time as "the runners are
# privileged, find an unprivileged account". They were not. This workflow had
# already measured the opposite in its own gate-state step and never joined the
# two: RUNNER_ACCOUNT=NT AUTHORITY\NETWORK SERVICE with RUNNER_ELEVATED=False,
# and UID=1000 with PASSWORDLESS_SUDO=NO. The verdict came from the probe
# INFERRING privilege from the Profiling API being allowed. The probe now
# measures its own privilege in-process, and the step below asserts the two
# agree, so that particular disagreement cannot go unnoticed again.
#
# Dispatch-only. Reads state and runs a short probe; changes nothing.

name: gpu-profiling-audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which runner(s) to audit'
        required: true
        type: choice
        options: [both, windows, wsl]
        default: both
      iters:
        description: 'Spin-kernel iterations (kernel duration knob)'
        required: false
        default: '200000'
      reps:
        description: 'Launch count for the overhead measurement'
        required: false
        default: '200'

jobs:

  # ---------------------------------------------------------------- Windows
  windows:
    if: ${{ inputs.target == 'both' || inputs.target == 'windows' }}
    runs-on: [self-hosted, Windows, X64, gpu]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The gate state decides whether the probe's verdict means anything.
      # On Windows the switch is a registry value under the driver's NVTweak
      # key, not a modprobe option — the modprobe remediation in NVIDIA's
      # article is Linux-only and does not apply here.
      - name: Profiling gate state + elevation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path captures | Out-Null

          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $pr = New-Object Security.Principal.WindowsPrincipal($id)
          $elevated = $pr.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "RUNNER_ACCOUNT=$($id.Name)"
          Write-Host "RUNNER_ELEVATED=$elevated"
          # Hand this to the verdict step so the probe's own in-process reading
          # can be checked against it. These two disagreed silently for two runs.
          $outer = if ($elevated) { 'YES' } else { 'NO' }
          "OUTER_PRIVILEGED=$outer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # "ABSENT means the restricted default applies" was asserted here for
          # two runs and is an INFERENCE, not a reading. The 2026-08-29 audit
          # contradicted it: ABSENT, yet an unprivileged process was allowed
          # PC_SAMPLING and the Profiling API on this very box. So report what
          # is actually there and stop narrating a default we never measured.
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Services\nvlddmkm\Global\NVTweak'
          $val = (Get-ItemProperty -Path $key -Name 'RmProfilingAdminOnly' -ErrorAction SilentlyContinue).RmProfilingAdminOnly
          if ($null -eq $val) {
            Write-Host "RmProfilingAdminOnly=ABSENT at the documented key"
            Write-Host "  (what the driver does when unset is NOT established here -"
            Write-Host "   the probe's T3 measures the gate's actual behaviour instead)"
          } else {
            Write-Host "RmProfilingAdminOnly=$val  (1 = admin-only, 0 = open)"
          }

          # The value may live under a per-adapter key rather than Global, so
          # sweep the whole service subtree before concluding it is unset
          # anywhere. Cheap, and it answers "where would I even set this?".
          Write-Host "--- RmProfilingAdminOnly anywhere under nvlddmkm ---"
          $found = $false
          Get-ChildItem -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\nvlddmkm' -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object {
              $p = $_.PSPath
              $v = (Get-ItemProperty -Path $p -Name 'RmProfilingAdminOnly' -ErrorAction SilentlyContinue).RmProfilingAdminOnly
              if ($null -ne $v) { Write-Host "FOUND $($_.Name) = $v"; $script:found = $true }
            }
          if (-not $found) { Write-Host "not present under any nvlddmkm subkey" }

          nvidia-smi
          nvcc --version | Select-Object -Last 1
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

      # Confirms the research claim that CUPTI ships with the Toolkit and is
      # deliberately NOT on the loader path — and records the real paths so our
      # dlopen probe list is measured rather than guessed.
      - name: CUPTI discovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "--- cupti64 DLLs under CUDA_PATH ---"
          Get-ChildItem -Path $env:CUDA_PATH -Recurse -Filter 'cupti64*.dll' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
          Write-Host "--- cupti.lib ---"
          Get-ChildItem -Path $env:CUDA_PATH -Recurse -Filter 'cupti.lib' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
          Write-Host "--- is cupti already resolvable on PATH? ---"
          $found = $false
          foreach ($p in $env:PATH.Split(';')) {
            if ($p -and (Test-Path $p)) {
              $hit = Get-ChildItem -Path $p -Filter 'cupti64*.dll' -ErrorAction SilentlyContinue
              if ($hit) { Write-Host "ON_PATH: $($hit.FullName)"; $found = $true }
            }
          }
          if (-not $found) { Write-Host "ON_PATH: none - matches the documented behaviour" }

      # nvcc on Windows needs cl.exe; source the VS build env via vswhere
      # (same pattern as gpu-probe.yml — the service PATH has no cmake/cl).
      - name: Compile the probe (MSVC host env)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          nvcc -arch=native -O2 tools\gpuprobe\probe_cupti_caps.cu -o probe_cupti_caps.exe ^
            -I"%CUDA_PATH%\extras\CUPTI\include" ^
            -L"%CUDA_PATH%\extras\CUPTI\lib64" -lcupti -lcuda
          if errorlevel 1 exit /b 1

      - name: Run the audit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # CUPTI is not on the loader path by design, so make the DLL findable
          # for this process only.
          $env:PATH = "$env:CUDA_PATH\extras\CUPTI\lib64;$env:CUDA_PATH\bin;$env:PATH"
          ./probe_cupti_caps.exe ${{ inputs.iters }} ${{ inputs.reps }} 2>&1 |
            Tee-Object -FilePath captures/windows-audit.txt
          if ($LASTEXITCODE -ne 0) { throw 'probe failed to initialize CUDA' }

      # THE POSITIVE CONTROL, added 2026-08-30 and overdue.
      # Run 33317956690 set RmProfilingAdminOnly=1, confirmed it live, rebooted,
      # and ran unprivileged — and T3 returned byte-identical results to the run
      # with the value absent. An instrument that reads the same before and after
      # you change the thing it measures is not measuring that thing. So T3's
      # premise (that GetCounterAvailability / PC_SAMPLING are where the gate
      # bites) is unverified, and every "gate not enforced" verdict so far rests
      # on it.
      #
      # Nsight Compute is the canonical user-visible manifestation: on a gated
      # box a non-admin ncu fails with ERR_NVGPUCTRPERM. If ncu is refused while
      # T1/T2 timing passes, the gate IS active, the CUPTI probes are simply not
      # gated calls, and that pairing is exactly what spec 5.4.4 asserts. If ncu
      # is allowed too, the registry value is not governing this driver.
      - name: Gate positive control (Nsight Compute)
        shell: powershell
        run: |
          # ASCII ONLY in this block. Windows PowerShell 5.1 reads the runner's
          # temp .ps1 as ANSI, not UTF-8: an em dash mis-decodes, terminates a
          # string early, and the next apostrophe opens one that never closes.
          # That is not hypothetical - it silently killed this step on
          # 2026-08-30 (run 33318146776), and continue-on-error turned the
          # unparseable script into a green step. Hence no continue-on-error
          # here either: a control that cannot fail is not a control.
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path captures | Out-Null

          $ncu = $null
          foreach ($root in @("$env:CUDA_PATH", "$env:ProgramFiles\NVIDIA Corporation")) {
            if ($root -and (Test-Path $root)) {
              $hit = Get-ChildItem -Path $root -Recurse -Filter 'ncu.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { $ncu = $hit.FullName; break }
            }
          }
          if (-not $ncu) {
            Write-Host "CONTROL=UNAVAILABLE (no ncu.exe found; the gate claim stays unverified)"
            exit 0
          }
          Write-Host "using $ncu"

          $env:PATH = "$env:CUDA_PATH\extras\CUPTI\lib64;$env:CUDA_PATH\bin;$env:PATH"
          & $ncu --metrics sm__cycles_elapsed.avg .\probe_cupti_caps.exe 1000 1 2>&1 | Tee-Object -FilePath captures/ncu-control.txt | Out-Null
          $txt = Get-Content captures/ncu-control.txt -Raw
          if ($null -eq $txt) { $txt = "" }

          if ($txt -match 'ERR_NVGPUCTRPERM') {
            Write-Host "CONTROL=REFUSED_PRIVILEGES - the gate IS active on this box"
            Write-Host "  So T3 CUPTI probes are NOT gated calls, and T1/T2 passing"
            Write-Host "  alongside this refusal is spec 5.4.4 demonstrated."
          } elseif ($txt -match 'sm__cycles_elapsed') {
            Write-Host "CONTROL=ALLOWED - counter profiling worked UNPRIVILEGED with"
            Write-Host "  RmProfilingAdminOnly=1, so that value does not govern this driver."
          } else {
            Write-Host "CONTROL=INCONCLUSIVE - ncu ran but matched neither pattern"
          }
          Write-Host "--- ncu capture, first 30 lines ---"
          Get-Content captures/ncu-control.txt -TotalCount 30

      - name: Verdict
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $cap = 'captures/windows-audit.txt'
          $v = (Select-String -Path $cap -Pattern '^RESULT verdict=' |
                  ForEach-Object { $_.Line }) -replace '^RESULT verdict=', ''
          $inner = (Select-String -Path $cap -Pattern '^RESULT process_privileged=' |
                      ForEach-Object { $_.Line }) -replace '^RESULT process_privileged=', ''
          Write-Host "=== WINDOWS verdict=$v ==="
          Write-Host "privileged: outer=$env:OUTER_PRIVILEGED  in-process=$inner"

          # The whole point of the revision: these are two independent readings
          # of the same fact, and a disagreement means one of them is lying.
          if ($inner -ne 'UNKNOWN' -and $inner -ne $env:OUTER_PRIVILEGED) {
            Write-Host "::error::privilege readings disagree - outer=$env:OUTER_PRIVILEGED in-process=$inner"
            exit 1
          }
          if ($v -ne 'EXEMPTION_PROVEN') {
            Write-Host "::warning::spec 5.4.4 not settled on Windows - verdict=$v"
          }

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiling-audit-windows
          path: captures/
          if-no-files-found: warn

  # -------------------------------------------------------------------- WSL
  wsl:
    if: ${{ inputs.target == 'both' || inputs.target == 'wsl' }}
    runs-on: [self-hosted, wsl]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WSL2 routes CUDA through the Windows driver via a stubbed libcuda.so;
      # there is no Linux nvidia kernel module, so /proc/driver/nvidia/params
      # is expected to be ABSENT and the Windows-side registry value governs.
      # Confirming that here is the point — it tells us which knob a user would
      # actually have to turn.
      - name: Profiling gate state + environment
        run: |
          set +e
          mkdir -p captures
          echo "WSL_DETECTED=$(grep -qi microsoft /proc/version && echo YES || echo NO)"
          echo "UID=$(id -u)  USER=$(id -un)"
          sudo -n true 2>/dev/null && echo "PASSWORDLESS_SUDO=YES" || echo "PASSWORDLESS_SUDO=NO"
          # The gate accepts root OR CAP_SYS_ADMIN (bit 21), so both count as
          # privileged. Handed to the verdict step to check the probe against.
          capeff=$(awk '/^CapEff:/ {print $2}' /proc/self/status)
          echo "CapEff=$capeff"
          if [ "$(id -u)" = "0" ] || [ $(( 0x${capeff:-0} >> 21 & 1 )) = 1 ]; then
            echo "OUTER_PRIVILEGED=YES" >> "$GITHUB_ENV"
          else
            echo "OUTER_PRIVILEGED=NO" >> "$GITHUB_ENV"
          fi
          echo "--- /proc/driver/nvidia/params (expected absent under WSL) ---"
          if [ -r /proc/driver/nvidia/params ]; then
            grep -i profil /proc/driver/nvidia/params || cat /proc/driver/nvidia/params
          else
            echo "ABSENT - no Linux nvidia module; the Windows driver governs"
          fi
          echo "--- driver / toolkit ---"
          nvidia-smi
          nvcc --version | tail -1
          echo "CUDA_HOME=${CUDA_HOME:-unset}"
          ls -d /usr/local/cuda* 2>/dev/null

      - name: CUPTI discovery
        run: |
          set +e
          echo "--- libcupti under /usr/local/cuda* ---"
          find /usr/local/cuda* -name 'libcupti.so*' 2>/dev/null
          echo "--- is libcupti resolvable by the loader? ---"
          if ldconfig -p 2>/dev/null | grep -q libcupti; then
            ldconfig -p | grep libcupti
          else
            echo "NOT in ldconfig cache - matches the documented behaviour"
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-unset}"

      - name: Compile the probe
        run: |
          set -euo pipefail
          CUDA="${CUDA_HOME:-$(ls -d /usr/local/cuda 2>/dev/null || ls -d /usr/local/cuda-* | head -1)}"
          echo "using CUDA=$CUDA"
          nvcc -arch=native -O2 tools/gpuprobe/probe_cupti_caps.cu -o probe_cupti_caps \
            -I"$CUDA/extras/CUPTI/include" \
            -L"$CUDA/extras/CUPTI/lib64" -lcupti -lcuda

      - name: Run the audit
        run: |
          set -euo pipefail
          CUDA="${CUDA_HOME:-$(ls -d /usr/local/cuda 2>/dev/null || ls -d /usr/local/cuda-* | head -1)}"
          export LD_LIBRARY_PATH="$CUDA/extras/CUPTI/lib64:${LD_LIBRARY_PATH:-}"
          ./probe_cupti_caps ${{ inputs.iters }} ${{ inputs.reps }} 2>&1 |
            tee captures/wsl-audit.txt

      - name: Verdict
        run: |
          set -uo pipefail
          v=$(sed -n 's/^RESULT verdict=//p' captures/wsl-audit.txt)
          inner=$(sed -n 's/^RESULT process_privileged=//p' captures/wsl-audit.txt)
          echo "=== WSL verdict=$v ==="
          echo "privileged: outer=${OUTER_PRIVILEGED:-unset}  in-process=${inner:-unset}"

          # Two independent readings of one fact; a disagreement means one lies.
          if [ -n "$inner" ] && [ "$inner" != "UNKNOWN" ] && \
             [ "$inner" != "${OUTER_PRIVILEGED:-}" ]; then
            echo "::error::privilege readings disagree - outer=${OUTER_PRIVILEGED:-unset} in-process=$inner"
            exit 1
          fi
          if [ "$v" != "EXEMPTION_PROVEN" ]; then
            echo "::warning::spec 5.4.4 not settled on WSL - verdict=$v"
          fi

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiling-audit-wsl
          path: captures/
          if-no-files-found: warn
